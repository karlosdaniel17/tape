<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disciplinas</title>
<style>
:root {
  --paper: #F5F4F0;
  --ink: #26241F;
  --line: #00000014;
  --seg: #FF6B6B;
  --ter: #FF9F43;
  --qua: #F4C430;
  --qui: #4CAF7D;
  --sex: #4D96FF;
  --sab: #A78BFA;
  --dom: #FF6FB5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

a { color: inherit; text-decoration: none; }

.topbar {
  border-bottom: 1px solid var(--line);
  background: var(--paper);
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.brand {
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand span { opacity: 0.4; font-weight: 500; font-size: 0.8em; }
nav.mainnav { display: flex; gap: 4px; flex-wrap: wrap; }
nav.mainnav a {
  font-size: 0.85rem;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 999px;
  opacity: 0.55;
  transition: all .15s ease;
}
nav.mainnav a:hover { opacity: 0.85; background: #00000008; }
nav.mainnav a.active { opacity: 1; background: var(--ink); color: var(--paper); }

main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
@media (max-width: 480px) {
  main { padding: 18px 12px 50px; }
  h1 { font-size: 1.5rem; }
  .topbar-inner { padding: 12px 14px; }
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0.5;
  margin-bottom: 4px;
}
h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; }

.disc-card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.disc-card .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.disc-card input.small { flex: 1; min-width: 140px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 0.9rem; }
.disc-card textarea { width: 100%; min-height: 60px; border: none; background: #00000006; border-radius: 10px; padding: 8px 10px; font-size: 0.85rem; font-family: inherit; resize: vertical; }
.disc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.del-btn { border: none; background: none; color: #B33; cursor: pointer; font-size: 0.8rem; opacity: 0.6; }
.del-btn:hover { opacity: 1; }
.new-disc-btn {
  padding: 7px 14px; border-radius: 999px; border: none; background: var(--ink); color: white;
  font-size: 0.78rem; font-weight: 700; cursor: pointer;
}
.disc-code-input {
  width: 84px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
  font-size: 0.82rem; font-weight: 700; text-transform: uppercase; text-align: center;
  background: #00000006; flex-shrink: 0;
}
.disc-name-row { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 0; }
.size-toggle { display: inline-flex; gap: 4px; margin-left: auto; }
.size-toggle button {
  font-size: 0.72rem; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: white; cursor: pointer; opacity: 0.55;
}
.size-toggle button.active { opacity: 1; background: var(--ink); color: white; border-color: var(--ink); }
.disc-card.compact { padding: 10px 14px; margin-bottom: 8px; }
.disc-card.compact textarea { min-height: 40px; }
.disc-card.grande { padding: 22px; margin-bottom: 20px; }
.disc-card.grande textarea { min-height: 90px; }

footer.foot { text-align: center; font-size: 11px; opacity: 0.35; padding: 30px 20px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">tape <span>caderno acadêmico</span></div>
    <nav class="mainnav">
      <a href="index.html">Semana</a>
      <a href="disciplinas.html" class="active">Disciplinas</a>
      <a href="anotacoes.html">Anotações</a>
      <a href="estudos.html">Estudos extras</a>
    </nav>
  </div>
</div>

<main>
  <div class="eyebrow">Cadastro</div>
  <h1>Disciplinas</h1>
  <p style="opacity:.55;font-size:.9rem;margin-top:0">Sala, professor e ementa de cada disciplina. As disciplinas cadastradas aqui aparecem na página Semana.</p>

  <div id="discList" style="margin-top:20px">Carregando...</div>

  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <button class="new-disc-btn" id="addBtn">+ Nova disciplina</button>
    <div class="size-toggle" id="sizeToggle">
      <button data-size="compact">A−</button>
      <button data-size="padrao" class="active">A</button>
      <button data-size="grande">A+</button>
    </div>
  </div>
</main>

<footer class="foot">Seus dados ficam salvos em tempo real na nuvem do Google.</footer>

<script type="module">
  import { auth, db } from './auth.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const DISC_COLORS = ["#FF6B6B", "#FF9F43", "#F4C430", "#4CAF7D", "#4D96FF", "#A78BFA", "#FF6FB5", "#2BB4B4"];
  let disciplinas = [];
  let currentUser = null;
  let currentSize = "padrao";

  function uid() {
    return Math.random().toString(36).slice(2, 10);
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      await carregarCloud();
    } else {
      currentUser = null;
      disciplinas = JSON.parse(localStorage.getItem("disciplinas") || "[]");
      render();
    }
  });

  async function carregarCloud() {
    try {
      const docRef = doc(db, "users", currentUser.uid);
      const docSnap = await getDoc(docRef);
      if (docSnap.exists() && docSnap.data().disciplinas) {
        disciplinas = docSnap.data().disciplinas;
      } else {
        disciplinas = JSON.parse(localStorage.getItem("disciplinas") || "[]");
      }
    } catch (e) {
      disciplinas = JSON.parse(localStorage.getItem("disciplinas") || "[]");
    }
    // Mantém o localStorage sincronizado para as outras páginas originais lerem
    localStorage.setItem("disciplinas", JSON.stringify(disciplinas));
    render();
  }

  async function salvarCloud() {
    localStorage.setItem("disciplinas", JSON.stringify(disciplinas));
    if (currentUser) {
      try {
        await setDoc(doc(db, "users", currentUser.uid), { disciplinas }, { merge: true });
      } catch (e) {
        console.error("Erro ao salvar:", e);
      }
    }
  }

  function render() {
    const listEl = document.getElementById("discList");
    listEl.innerHTML = "";

    if (disciplinas.length === 0) {
      listEl.innerHTML = `<p style="opacity:0.5; font-size:0.9rem;">Nenhuma disciplina cadastrada ainda.</p>`;
      return;
    }

    disciplinas.forEach((d, idx) => {
      const card = document.createElement("div");
      card.className = `disc-card ${currentSize}`;
      card.style.borderLeft = `5px solid ${d.cor || DISC_COLORS[idx % DISC_COLORS.length]}`;

      card.innerHTML = `
        <div class="disc-top">
          <div class="disc-name-row">
            <input type="text" class="disc-code-input" placeholder="CÓDIGO" value="${d.codigo || ''}" data-field="codigo">
            <input type="text" class="small" placeholder="Nome da disciplina" value="${d.nome || ''}" data-field="nome" style="font-weight:bold">
          </div>
          <button class="del-btn" data-action="delete">remover</button>
        </div>
        <div class="row">
          <input type="text" class="small" placeholder="Sala" value="${d.sala || ''}" data-field="sala">
          <input type="text" class="small" placeholder="Professor(a)" value="${d.prof || ''}" data-field="prof">
          <input type="text" class="small" placeholder="Horário (ex.: Seg/Qua 08h–10h)" value="${d.horario || ''}" data-field="horario">
        </div>
        <div>
          <label style="font-size:10px; letter-spacing:0.12em; text-transform:uppercase; opacity:0.45; display:block; margin-bottom:4px">Ementa</label>
          <textarea placeholder="Conteúdo programático..." data-field="ementa">${d.ementa || ''}</textarea>
        </div>
      `;

      card.querySelectorAll("input, textarea").forEach(input => {
        input.addEventListener("input", (e) => {
          const field = e.target.dataset.field;
          d[field] = e.target.value;
          salvarCloud();
        });
      });

      card.querySelector('[data-action="delete"]').addEventListener("click", () => {
        disciplinas.splice(idx, 1);
        salvarCloud();
        render();
      });

      listEl.appendChild(card);
    });
  }

  document.getElementById("addBtn").addEventListener("click", () => {
    disciplinas.push({
      id: uid(),
      codigo: "",
      nome: "",
      sala: "",
      prof: "",
      horario: "",
      ementa: "",
      cor: DISC_COLORS[disciplinas.length % DISC_COLORS.length]
    });
    salvarCloud();
    render();
  });

  document.getElementById("sizeToggle").addEventListener("click", (e) => {
    if (e.target.tagName === "BUTTON") {
      document.querySelectorAll("#sizeToggle button").forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");
      currentSize = e.target.dataset.size;
      render();
    }
  });
</script>
</body>
</html>
