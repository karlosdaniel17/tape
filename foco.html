<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foco</title>
<style>
:root {
  --paper: #F5F4F0;
  --ink: #26241F;
  --line: #00000014;
  --accent: #4D96FF;
  --accent-2: #4CAF7D;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
a { color: inherit; text-decoration: none; }

.topbar { border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 10; }
.topbar-inner { max-width: 1100px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.brand { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
nav.mainnav { display: flex; gap: 4px; flex-wrap: wrap; }
nav.mainnav a { font-size: 0.85rem; font-weight: 600; padding: 8px 14px; border-radius: 999px; opacity: 0.55; transition: all .15s ease; }
nav.mainnav a:hover { opacity: 0.85; background: #00000008; }
nav.mainnav a.active { opacity: 1; background: var(--ink); color: var(--paper); }
.lang-switch { flex-shrink: 0; }

main { max-width: 640px; margin: 0 auto; padding: 30px 16px 60px; }
@media (max-width: 480px) { main { padding: 20px 12px 50px; } }
.eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.5; margin-bottom: 4px; }
h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; }
.lead { opacity: 0.6; font-size: 0.92rem; line-height: 1.5; margin: 0 0 24px; }

.streak-row { display: flex; gap: 12px; margin-bottom: 20px; }
.streak-card {
  flex: 1; background: white; border: 1px solid var(--line); border-radius: 16px;
  padding: 16px; text-align: center;
}
.streak-num { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; }
.streak-label { font-size: 0.72rem; opacity: 0.5; margin-top: 2px; }

.timer-card { background: white; border: 1px solid var(--line); border-radius: 20px; padding: 30px 20px; text-align: center; }
.timer-mode { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.5; margin-bottom: 10px; }
.timer-display { font-size: 3.4rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-bottom: 20px; }
.timer-ring { position: relative; width: 220px; height: 220px; margin: 0 auto 22px; }
.timer-ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.timer-ring .bg { stroke: #00000010; }
.timer-ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.timer-ring .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }

.timer-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.timer-controls button {
  padding: 12px 22px; border-radius: 999px; border: none; font-weight: 700; font-size: 0.9rem; cursor: pointer;
}
.btn-start { background: var(--ink); color: var(--paper); }
.btn-reset { background: #00000008; color: var(--ink); }

.config-row { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
.config-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.config-item label { font-size: 0.72rem; opacity: 0.5; }
.config-item input {
  width: 64px; text-align: center; padding: 7px; border-radius: 8px; border: 1px solid var(--line);
  font-size: 0.9rem; font-family: inherit;
}

.cycles-today { text-align: center; margin-top: 18px; font-size: 0.85rem; opacity: 0.6; }
.week-strip { display: flex; gap: 6px; justify-content: center; margin-top: 20px; }
.week-dot { width: 30px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 0.68rem; font-weight: 700; background: #00000008; opacity: 0.4; }
.week-dot.done { background: var(--accent-2); color: white; opacity: 1; }
.week-dot.today { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="brand"></div>
    <nav class="mainnav" id="mainnav"></nav>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="lang-switch" id="langSwitch"></div>
      <div id="authBox"></div>
    </div>
  </div>
</div>

<main>
  <div class="eyebrow">Concentração</div>
  <h1>Foco</h1>
  <p class="lead">Ciclos de foco e pausa pra te ajudar a começar e não procrastinar. Cada ciclo completo de foco conta um ponto na sua sequência do dia.</p>

  <div class="streak-row">
    <div class="streak-card">
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label">dias seguidos</div>
    </div>
    <div class="streak-card">
      <div class="streak-num" id="cyclesTotalNum">0</div>
      <div class="streak-label">ciclos no total</div>
    </div>
  </div>

  <div class="timer-card">
    <div class="timer-mode" id="timerMode">Foco</div>
    <div class="timer-ring">
      <svg viewBox="0 0 220 220">
        <circle class="bg" cx="110" cy="110" r="100" fill="none" stroke-width="12"/>
        <circle class="fg" id="ringFg" cx="110" cy="110" r="100" fill="none" stroke-width="12" stroke-dasharray="628" stroke-dashoffset="0"/>
      </svg>
      <div class="center">
        <div class="timer-display" id="timerDisplay">25:00</div>
      </div>
    </div>
    <div class="timer-controls">
      <button class="btn-start" id="btnStartPause">Começar</button>
      <button class="btn-reset" id="btnReset">Reiniciar</button>
    </div>
    <div class="config-row" id="configRow">
      <div class="config-item">
        <label>Foco (min)</label>
        <input type="number" id="focoMin" min="1" max="120" value="25">
      </div>
      <div class="config-item">
        <label>Pausa (min)</label>
        <input type="number" id="pausaMin" min="1" max="60" value="5">
      </div>
    </div>
    <div class="cycles-today" id="cyclesTodayText"></div>
  </div>

  <div class="week-strip" id="weekStrip"></div>
</main>

<script>
const SITE_NAME = "tape";
document.title = SITE_NAME + " · Foco";
document.getElementById("brand").innerHTML = `<svg width="30" height="30" viewBox="0 0 200 200" style="flex-shrink:0"><rect width="200" height="200" rx="40" fill="#F1E6CF"/><circle cx="100" cy="46" r="7" fill="#8C3B2E"/><polyline points="38,146 100,92 162,146" fill="none" stroke="#B65C38" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><polyline points="55,119 100,77 145,119" fill="none" stroke="#D89B4A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><polyline points="72,92 100,64 128,92" fill="none" stroke="#56705A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${SITE_NAME}</span>`;

const NAV_LINKS = [
  { href: "index.html", label: "Semana" },
  { href: "disciplinas.html", label: "Disciplinas" },
  { href: "anotacoes.html", label: "Anotações" },
  { href: "estudos.html", label: "Estudos extras" },
  { href: "foco.html", label: "Foco" },
  { href: "calculadora.html", label: "Calculadora" },
  { href: "ajuda.html", label: "Ajuda" },
  { href: "sugestoes.html", label: "Sugestões" },
  { href: "creditos.html", label: "Créditos" },
];
document.getElementById("mainnav").innerHTML = NAV_LINKS
  .map(l => `<a href="${l.href}" class="${l.href === "foco.html" ? "active" : ""}">${l.label}</a>`)
  .join("");

const langs = [["pt","Português"],["en","English"],["es","Español"]];
const currentLang = localStorage.getItem("idioma") || "pt";
document.getElementById("langSwitch").innerHTML = `
  <div class="lang-dropdown" style="position:relative">
    <button id="langToggleBtn" style="display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:white;cursor:pointer;color:var(--ink)">🌐 ${currentLang.toUpperCase()} <span style="font-size:9px;opacity:.5">▾</span></button>
    <div id="langMenu" style="position:absolute;top:calc(100% + 8px);right:0;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);overflow:hidden;min-width:150px;display:none;z-index:30">
      ${langs.map(([code, name]) => `<button data-lang="${code}" style="width:100%;text-align:left;padding:10px 14px;border:none;background:white;font-size:.85rem;cursor:pointer;display:block;color:var(--ink)">${name}</button>`).join("")}
    </div>
  </div>`;
document.getElementById("langToggleBtn").addEventListener("click", (e) => { e.stopPropagation(); document.getElementById("langMenu").style.display = document.getElementById("langMenu").style.display === "block" ? "none" : "block"; });
document.querySelectorAll("#langMenu button").forEach(b => b.addEventListener("click", () => { localStorage.setItem("idioma", b.dataset.lang); location.href = "index.html"; }));
document.addEventListener("click", () => { const m = document.getElementById("langMenu"); if (m) m.style.display = "none"; });

// ---------- localStorage helpers ----------
function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { return false; }
}
function hojeISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function diaISO(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

// ---------- estado do timer ----------
let registro = loadJSON("foco_registro", {}); // { "2026-08-13": 3, ... }
let focoMin = loadJSON("foco_config_foco", 25);
let pausaMin = loadJSON("foco_config_pausa", 5);
let modo = "foco"; // foco | pausa
let segundosRestantes = focoMin * 60;
let rodando = false;
let intervalId = null;

const RAIO = 100, CIRCUNF = 2 * Math.PI * RAIO;
document.getElementById("ringFg").setAttribute("stroke-dasharray", CIRCUNF.toFixed(0));

document.getElementById("focoMin").value = focoMin;
document.getElementById("pausaMin").value = pausaMin;

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

function atualizarDisplay() {
  document.getElementById("timerDisplay").textContent = fmt(segundosRestantes);
  document.getElementById("timerMode").textContent = modo === "foco" ? "Foco" : "Pausa";
  const total = (modo === "foco" ? focoMin : pausaMin) * 60;
  const fracao = total > 0 ? segundosRestantes / total : 0;
  document.getElementById("ringFg").style.strokeDashoffset = (CIRCUNF * (1 - fracao)).toFixed(0);
  document.getElementById("ringFg").style.stroke = modo === "foco" ? "#4D96FF" : "#4CAF7D";
}

function tocarSom() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 660;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
    osc.start(); osc.stop(ctx.currentTime + 0.8);
  } catch (e) {}
}

function registrarCiclo() {
  const hoje = hojeISO();
  registro[hoje] = (registro[hoje] || 0) + 1;
  saveJSON("foco_registro", registro);
  if (window.pushFocoToCloud) window.pushFocoToCloud(registro);
  renderStreak();
}

function proximoModo() {
  tocarSom();
  if (modo === "foco") {
    registrarCiclo();
    modo = "pausa";
    segundosRestantes = pausaMin * 60;
  } else {
    modo = "foco";
    segundosRestantes = focoMin * 60;
  }
  atualizarDisplay();
}

function tick() {
  segundosRestantes--;
  if (segundosRestantes < 0) { proximoModo(); return; }
  atualizarDisplay();
}

document.getElementById("btnStartPause").addEventListener("click", () => {
  rodando = !rodando;
  const btn = document.getElementById("btnStartPause");
  const configRow = document.getElementById("configRow");
  if (rodando) {
    btn.textContent = "Pausar";
    configRow.style.opacity = "0.35";
    configRow.style.pointerEvents = "none";
    intervalId = setInterval(tick, 1000);
  } else {
    btn.textContent = "Continuar";
    clearInterval(intervalId);
  }
});

document.getElementById("btnReset").addEventListener("click", () => {
  rodando = false;
  clearInterval(intervalId);
  modo = "foco";
  segundosRestantes = focoMin * 60;
  document.getElementById("btnStartPause").textContent = "Começar";
  document.getElementById("configRow").style.opacity = "1";
  document.getElementById("configRow").style.pointerEvents = "auto";
  atualizarDisplay();
});

document.getElementById("focoMin").addEventListener("change", (e) => {
  focoMin = Math.max(1, parseInt(e.target.value) || 25);
  saveJSON("foco_config_foco", focoMin);
  if (!rodando && modo === "foco") { segundosRestantes = focoMin * 60; atualizarDisplay(); }
});
document.getElementById("pausaMin").addEventListener("change", (e) => {
  pausaMin = Math.max(1, parseInt(e.target.value) || 5);
  saveJSON("foco_config_pausa", pausaMin);
  if (!rodando && modo === "pausa") { segundosRestantes = pausaMin * 60; atualizarDisplay(); }
});

// ---------- streak + semana ----------
function calcularStreak() {
  let streak = 0;
  let offset = (registro[hojeISO()] || 0) > 0 ? 0 : -1;
  if (offset === -1 && !(registro[diaISO(-1)] > 0)) return 0;
  while (registro[diaISO(offset)] > 0) { streak++; offset--; }
  return streak;
}
function renderStreak() {
  document.getElementById("streakNum").textContent = calcularStreak();
  const total = Object.values(registro).reduce((a, b) => a + b, 0);
  document.getElementById("cyclesTotalNum").textContent = total;
  document.getElementById("cyclesTodayText").textContent =
    `${registro[hojeISO()] || 0} ciclo(s) de foco completos hoje`;
  renderSemana();
}
function renderSemana() {
  const dias = ["D","S","T","Q","Q","S","S"];
  const strip = document.getElementById("weekStrip");
  strip.innerHTML = "";
  for (let i = -6; i <= 0; i++) {
    const iso = diaISO(i);
    const d = new Date();
    d.setDate(d.getDate() + i);
    const dot = document.createElement("div");
    dot.className = "week-dot" + ((registro[iso] || 0) > 0 ? " done" : "") + (i === 0 ? " today" : "");
    dot.textContent = dias[d.getDay()];
    dot.title = iso;
    strip.appendChild(dot);
  }
}

atualizarDisplay();
renderStreak();
window.renderFocoStreak = renderStreak;
</script>
<script type="module" src="auth.js"></script>
<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAnv0eey-idqfBf8hVLvQ-0IMtoF4RXnkc",
  authDomain: "tape-1717.firebaseapp.com",
  projectId: "tape-1717",
  storageBucket: "tape-1717.firebasestorage.app",
  messagingSenderId: "244010846598",
  appId: "1:244010846598:web:e704631b12d4137fdcc407"
};
const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let cloudUid = null;

async function pullFocoFromCloud(uid) {
  try {
    const ref = doc(db, "usuarios", uid, "dados", "foco_registro");
    const snap = await getDoc(ref);
    if (snap.exists() && snap.data().registro) {
      const cloudReg = snap.data().registro;
      const local = JSON.parse(localStorage.getItem("foco_registro") || "{}");
      const merged = { ...cloudReg };
      for (const dia in local) merged[dia] = Math.max(merged[dia] || 0, local[dia]);
      localStorage.setItem("foco_registro", JSON.stringify(merged));
      await setDoc(ref, { registro: merged, atualizadoEm: Date.now() });
    } else {
      const local = JSON.parse(localStorage.getItem("foco_registro") || "{}");
      await setDoc(ref, { registro: local, atualizadoEm: Date.now() });
    }
  } catch (e) {
    console.error("tape: erro ao sincronizar foco", e);
  }
  if (window.renderFocoStreak) window.renderFocoStreak();
}

window.pushFocoToCloud = async function (registro) {
  if (!cloudUid) return;
  try {
    await setDoc(doc(db, "usuarios", cloudUid, "dados", "foco_registro"), { registro, atualizadoEm: Date.now() });
  } catch (e) {
    console.error("tape: erro ao salvar foco na nuvem", e);
  }
};

let jaSincronizou = false;
onAuthStateChanged(auth, (user) => {
  cloudUid = user ? user.uid : null;
  if (cloudUid && !jaSincronizou) {
    jaSincronizou = true;
    pullFocoFromCloud(cloudUid);
  }
});
</script>
</body>
</html>
