<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Exercícios</title>
<style>
:root {
  color-scheme: only light;
  --paper: #F2F4EF;
  --ink: #1A2333;
  --line: #1A233318;
  --card: #FFFFFF;
  --overlay: #1A23330A;
  --overlay-2: #1A233314;
  --seg: #C13B2E;
  --ter: #D9A441;
  --qua: #3E6E8A;
  --qui: #5B7A4F;
  --sex: #7A5C99;
  --sab: #C97B4E;
  --dom: #B5568A;
  --pauta: #1A23330F;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background:
    linear-gradient(var(--paper) 0 0),
    repeating-linear-gradient(0deg, transparent, transparent 27px, var(--pauta) 27px, var(--pauta) 28px);
  color: var(--ink);
  font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

a { color: inherit; text-decoration: none; }

/* ---------- Navbar ---------- */
.topbar {
  border-bottom: 1px solid var(--line);
  background: var(--paper);
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.brand {
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-text-group { display: flex; flex-direction: column; gap: 2px; line-height: 1.1; }
.brand span.brand-text {
  opacity: 1; font-weight: 800; font-size: 1.05em; letter-spacing: 0.03em; text-transform: capitalize;
  color: var(--ink);
}
@supports (background-clip: text) or (-webkit-background-clip: text) {
  .brand span.brand-text {
    background: linear-gradient(120deg, #C13B2E, #D9A441 55%, #3E6E8A);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  }
}
.brand span.brand-tagline { opacity: 0.55; font-weight: 600; font-size: 0.62em; letter-spacing: 0.02em; }
nav.mainnav { display: flex; gap: 4px; flex-wrap: wrap; }
nav.mainnav a {
  font-size: 0.85rem;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 999px;
  opacity: 0.55;
  transition: all .15s ease;
}
nav.mainnav a:hover { opacity: 0.85; background: #00000008; }
nav.mainnav a.active { opacity: 1; background: var(--ink); color: var(--paper); }

.lang-dropdown { position: relative; }
.lang-toggle {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.78rem; font-weight: 700; padding: 7px 13px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); cursor: pointer; color: var(--ink);
}
.lang-toggle:hover { background: #00000008; }
.lang-toggle .caret { font-size: 9px; opacity: 0.5; }
.lang-menu {
  position: absolute; top: calc(100% + 8px); right: 0;
  background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); border: 1px solid var(--line); border-radius: 4px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden;
  min-width: 150px; display: none; z-index: 30;
}
.lang-menu.open { display: block; }
.lang-menu button {
  width: 100%; text-align: left; padding: 10px 14px; border: none; background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10);
  font-size: 0.85rem; cursor: pointer; display: block; color: var(--ink);
}
.lang-menu button:hover { background: #00000008; }
.lang-menu button.active { font-weight: 800; background: #00000006; }


main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
@media (max-width: 480px) {
  main { padding: 18px 12px 50px; }
  h1 { font-size: 1.5rem; }
  .topbar-inner { padding: 12px 14px; }
}

.eyebrow {
  display: inline-block;
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.02em;
  opacity: 0.9;
  margin-bottom: 10px;
  padding: 3px 10px 4px;
  background: linear-gradient(100deg, var(--ter), #E8BD3F);
  color: #3A2E10;
  transform: rotate(-1.4deg);
  box-shadow: 0 1px 2px rgba(26,35,51,0.18);
}
h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; }
h1::after { content: ""; display: block; width: 46px; height: 4px; border-radius: 999px; margin-top: 10px; background: linear-gradient(120deg, #C13B2E, #D9A441 55%, #3E6E8A); }

/* ---------- Week nav ---------- */
.weeknav {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 18px 0 20px;
}
.weeknav button {
  width: 34px; height: 34px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10);
  cursor: pointer;
  font-size: 1rem;
}
.weeknav button:hover { background: #00000008; }
.weekrange { font-size: 0.9rem; font-weight: 600; padding: 6px 14px; border-radius: 999px; background: #00000008; }
.today-link { font-size: 0.8rem; opacity: 0.55; text-decoration: underline; cursor: pointer; background: none; border: none; }

/* ---------- Disciplinas chips ---------- */
.disc-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 26px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 6px 6px 12px;
  border-radius: 999px;
  font-size: 0.85rem; font-weight: 600;
  cursor: grab;
  user-select: none;
}
.chip button {
  border: none; width: 16px; height: 16px; border-radius: 999px;
  font-size: 11px; cursor: pointer; opacity: 0.5;
}
.chip button:hover { opacity: 1; }
.add-disc { display: inline-flex; gap: 6px; }
.add-disc input {
  font-size: 0.85rem; padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--line); width: 150px;
}
.add-disc button {
  width: 32px; height: 32px; border-radius: 999px; border: none;
  background: var(--ink); color: var(--paper); cursor: pointer; font-size: 1rem;
}

/* ---------- Day grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
@media (max-width: 380px) {
  .grid { grid-template-columns: 1fr; }
}

.day-card { background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
.day-head {
  padding: 12px 16px; color: white; display: flex; align-items: center; justify-content: space-between;
}
.day-head .date { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.85; }
.day-head .name { font-size: 1.1rem; font-weight: 800; }
.day-head button {
  width: 26px; height: 26px; border-radius: 999px; border: none;
  background: rgba(255,255,255,0.25); color: white; cursor: pointer; font-weight: 700;
}
.day-addlist { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px; }
.day-addlist button { font-size: 0.75rem; padding: 5px 10px; border-radius: 999px; border: 1px solid; background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); cursor: pointer; }

.day-schedule { padding: 10px 14px 6px; display: flex; flex-direction: column; gap: 6px; min-height: 30px; }
.sched-empty { font-size: 0.78rem; opacity: 0.4; padding: 4px 0; }
.sched-item {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); border-radius: 4px; padding: 6px 10px;
  cursor: grab;
}
.sched-item .dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
.sched-item .nm { flex: 1; font-size: 0.85rem; font-weight: 600; }
.sched-item input { width: 52px; font-size: 0.75rem; text-align: right; border: none; background: transparent; opacity: 0.7; }
.sched-item .rm { border: none; background: none; opacity: 0.3; cursor: pointer; font-size: 0.8rem; }
.sched-item .rm:hover { opacity: 0.8; }

.day-body { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); }
.field-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.6; margin-bottom: 5px; }
textarea, .textinput {
  width: 100%; border: none; background: #00000006; border-radius: 4px;
  padding: 8px 10px; font-size: 0.85rem; font-family: inherit; resize: vertical;
}
textarea:focus, .textinput:focus { outline: 2px solid #00000022; }

.task-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
.task-row span.done { opacity: 0.4; text-decoration: line-through; }
.task-row .rm { margin-left: auto; border: none; background: none; opacity: 0; cursor: pointer; }
.task-row:hover .rm { opacity: 0.4; }
.task-row .rm:hover { opacity: 1; }
.task-add { display: flex; gap: 6px; margin-top: 2px; }
.task-add input { flex: 1; font-size: 0.85rem; border: none; background: #00000006; border-radius: 8px; padding: 6px 10px; }

/* ---------- Disciplinas page ---------- */
.disc-card { background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 14px; }
.disc-card .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.disc-card input.small { flex: 1; min-width: 140px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 0.9rem; }
.disc-card input[type="date"].small { flex: 1; min-width: 140px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 0.85rem; color: var(--ink); background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); }
.disc-card textarea { min-height: 60px; }
.disc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.disc-name { font-weight: 800; font-size: 1.05rem; }
.del-btn { border: none; background: none; color: #B33; cursor: pointer; font-size: 0.8rem; opacity: 0.6; }
.del-btn:hover { opacity: 1; }
.new-disc-btn {
  padding: 7px 14px; border-radius: 999px; border: none; background: var(--ink); color: var(--paper);
  font-size: 0.78rem; font-weight: 700; cursor: pointer;
}
.disc-code-input {
  width: 84px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
  font-size: 0.82rem; font-weight: 700; text-transform: uppercase; text-align: center;
  background: #00000006; flex-shrink: 0;
}
.disc-name-row { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 0; }
.size-toggle { display: inline-flex; gap: 4px; margin-left: auto; }
.size-toggle button {
  font-size: 0.72rem; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); cursor: pointer; opacity: 0.55;
}
.size-toggle button.active { opacity: 1; background: var(--ink); color: var(--paper); border-color: var(--ink); }
.disc-card.compact { padding: 10px 14px; margin-bottom: 8px; }
.disc-card.compact .disc-card textarea, .disc-card.compact textarea { min-height: 40px; }
.disc-card.grande { padding: 22px; margin-bottom: 20px; }
.disc-card.grande textarea { min-height: 90px; }
.disc-card.minimized { padding: 10px 14px; }
.disc-card.minimized .row, .disc-card.minimized .field-label, .disc-card.minimized .avaliacoes-list,
.disc-card.minimized .add-aval-btn, .disc-card.minimized textarea { display: none; }
.min-disc-btn {
  border: 1px solid var(--line); background: var(--card); opacity: 1; cursor: pointer;
  font-size: 1rem; font-weight: 700; width: 30px; height: 30px; border-radius: 999px;
  flex-shrink: 0; color: var(--ink); display: flex; align-items: center; justify-content: center;
}
.min-disc-btn:hover { background: var(--overlay); }
.avaliacoes-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.avaliacao-row { display: flex; gap: 8px; align-items: center; }
.avaliacao-row select {
  flex: 1; min-width: 110px; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line);
  font-size: 0.82rem; background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); color: var(--ink);
}
.avaliacao-row input[type="date"] {
  flex: 1; min-width: 120px; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line);
  font-size: 0.82rem; background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); color: var(--ink);
}
.avaliacao-row .rm-aval { border: none; background: none; opacity: 0.35; cursor: pointer; font-size: 0.9rem; flex-shrink: 0; }
.avaliacao-row .rm-aval:hover { opacity: 0.85; }
.add-aval-btn {
  align-self: flex-start; font-size: 0.78rem; padding: 5px 12px; border-radius: 999px;
  border: 1px dashed var(--line); background: none; cursor: pointer; opacity: 0.65; margin-top: 2px;
}
.add-aval-btn:hover { opacity: 1; }

/* ---------- Anotacoes page ---------- */
.notes-wrap { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
@media (max-width: 800px) { .notes-wrap { grid-template-columns: 1fr; } }
.notes-wrap textarea { min-height: 460px; font-size: 0.95rem; line-height: 1.5; }
.calc-box { background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); border: 1px solid var(--line); border-radius: 6px; padding: 16px; height: fit-content; }
.calc-display { font-size: 1.4rem; text-align: right; padding: 10px; background: #00000006; border-radius: 4px; margin-bottom: 10px; min-height: 28px; word-break: break-all; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.calc-grid button {
  padding: 12px 0; border-radius: 4px; border: none; background: #00000008; font-size: 1rem; cursor: pointer;
}
.calc-grid button.op { background: var(--ink); color: var(--paper); }
.calc-grid button:hover { filter: brightness(0.95); }
.calc-hist { margin-top: 12px; font-size: 0.75rem; opacity: 0.5; max-height: 90px; overflow-y: auto; }

/* ---------- Estudos extras page ---------- */
.study-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.study-card { background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.study-card .top { display: flex; justify-content: space-between; align-items: center; }
.study-card input.title {
  font-size: 1.05rem; font-weight: 800; border: none; background: transparent; flex: 1; padding: 2px 0;
}
.study-card textarea { min-height: 100px; }
.add-study-card {
  border: 2px dashed var(--line); border-radius: 6px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; min-height: 100px; opacity: 0.5; font-weight: 700; background: none;
}
.add-study-card:hover { opacity: 0.9; }

footer.foot { text-align: center; font-size: 11px; opacity: 0.35; padding: 30px 20px; }

/* ---------- Trilhas / árvore de habilidades ---------- */
.trilha-select-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin: 4px 0 22px; }
.trilha-select-row select { font-size:0.9rem; padding:9px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); color:var(--ink); }
.trilha-progresso-track { height:8px; border-radius:999px; background:var(--overlay); overflow:hidden; margin: 6px 0 8px; max-width:420px; }
.trilha-progresso-fill { height:100%; background:linear-gradient(120deg,#C13B2E,#D9A441 55%,#3E6E8A); border-radius:999px; transition:width .3s ease; }
.trilha-progresso-texto { font-size:0.8rem; opacity:.6; margin-bottom:22px; }
.modulos-grid { display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
.modulo-card { background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display:flex; flex-direction:column; gap:8px; }
.modulo-card.bloqueado { opacity:.5; }
.modulo-top { display:flex; align-items:center; gap:10px; }
.modulo-status { font-size:1.2rem; flex-shrink:0; }
.modulo-nome { font-weight:800; font-size:1rem; flex:1; }
.modulo-pre { font-size:0.75rem; opacity:.55; }
.modulo-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
.modulo-actions button { font-size:0.78rem; padding:6px 13px; border-radius:999px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
.modulo-actions button.concluir { background:var(--ink); color:var(--paper); border-color:var(--ink); }
.modulo-actions button.concluir:disabled { opacity:.35; cursor:not-allowed; }
.modulo-actions button.excluir { color:#B33; opacity:.7; }
.modulo-actions button.excluir:hover { opacity:1; }
.novo-modulo-box { background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); border: 1px dashed var(--line); border-radius: 6px; padding: 16px; margin-top:6px; }
.novo-modulo-box input[type="text"] { width:100%; box-sizing:border-box; font-size:0.9rem; padding:9px 12px; border-radius:8px; border:1px solid var(--line); margin-bottom:10px; font-family:inherit; }
.pre-list { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.pre-chip { font-size:0.78rem; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--overlay); cursor:pointer; user-select:none; }
.pre-chip.selecionado { background:var(--ink); color:var(--paper); border-color:var(--ink); }
.sem-disciplinas { opacity:.6; font-size:.9rem; }

/* ---------- Exercícios ---------- */
.ex-subject-tabs { display:flex; flex-wrap:wrap; gap:8px; margin: 4px 0 12px; }
.ex-subject-tabs button {
  font-size:0.85rem; font-weight:700; padding:9px 16px; border-radius:999px;
  border:1px solid var(--line); background:var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10);
  cursor:pointer; opacity:.6; color:var(--ink);
}
.ex-subject-tabs button.active { opacity:1; background:var(--ink); color:var(--paper); border-color:var(--ink); }
.ex-level-tabs { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.ex-level-tabs button {
  font-size:0.8rem; font-weight:700; padding:7px 15px; border-radius:999px;
  border:1px solid var(--line); background:var(--card); cursor:pointer; opacity:.55; color:var(--ink);
}
.ex-level-tabs button.facil.active { opacity:1; background:#5B7A4F; color:#fff; border-color:#5B7A4F; }
.ex-level-tabs button.intermediario.active { opacity:1; background:#D9A441; color:#fff; border-color:#D9A441; }
.ex-level-tabs button.dificil.active { opacity:1; background:#C1502B; color:#fff; border-color:#C1502B; }
.ex-progresso-track { height:8px; border-radius:999px; background:var(--overlay); overflow:hidden; margin: 10px 0 6px; max-width:420px; }
.ex-progresso-fill { height:100%; border-radius:999px; transition:width .3s ease; background:linear-gradient(120deg,#C13B2E,#D9A441 55%,#3E6E8A); }
.ex-progresso-texto { font-size:0.8rem; opacity:.55; margin-bottom:18px; }
.ex-list { display:flex; flex-direction:column; gap:10px; }
.ex-item { background: var(--card); box-shadow: 3px 3px 0 rgba(26,35,51,0.10); border: 1px solid var(--line); border-radius: 6px; padding:16px; display:flex; flex-direction:column; gap:12px; }
.ex-item.acertou { border-color: var(--qui); }
.ex-item-top { display:flex; align-items:flex-start; gap:10px; }
.ex-item-num { width:24px; height:24px; border-radius:999px; background:var(--overlay); display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:800; flex-shrink:0; margin-top:1px; }
.ex-item-enunciado { flex:1; font-size:0.92rem; line-height:1.45; white-space:pre-wrap; }
.ex-opcoes { display:flex; flex-direction:column; gap:8px; padding-left:34px; }
.ex-opcao {
  text-align:left; font-size:0.85rem; padding:10px 14px; border-radius:10px;
  border:1px solid var(--line); background:var(--overlay); cursor:pointer; color:var(--ink);
}
.ex-opcao:hover { background:var(--overlay-2); }
.ex-opcao.correta-marcada { background:#5B7A4F30; border-color:#5B7A4F; font-weight:700; }
.ex-opcao.errada-marcada { background:#C1502B25; border-color:#C1502B; }
.ex-opcao:disabled { cursor:default; }
.ex-resolucao-btn {
  align-self:flex-start; margin-left:34px; font-size:0.78rem; padding:6px 14px; border-radius:999px;
  border:1px dashed var(--line); background:none; color:var(--ink); cursor:pointer; opacity:.6;
}
.ex-resolucao-btn:hover { opacity:1; }
.ex-resolucao { display:none; padding-left:34px; font-size:0.85rem; opacity:.85; border-top:1px solid var(--line); padding-top:12px; white-space:pre-wrap; }
.ex-resolucao.aberta { display:block; }
.ex-resolucao strong { opacity:.6; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:4px; }
.ex-resolucao pre { background:#00000008; border-radius:10px; padding:12px; overflow-x:auto; font-size:0.8rem; line-height:1.5; margin: 6px 0 0; }

function saveJSON(key, value) {

  date.setHours(0, 0, 0, 0);
  return date;
}

function renderLangSwitch() {

    </div>`;
  const toggleBtn = document.getElementById("langToggleBtn");
  const menu = document.getElementById("langMenu");
  toggleBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    menu.classList.toggle("open");
  });
  menu.querySelectorAll("button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

}

        { enunciado: "Implemente uma lista encadeada simples em C, com uma função para inserir um novo nó no início.", resolucao: "#include <stdio.h>\n#include <stdlib.h>\n\nstruct No {\n    int valor;\n    struct No *prox;\n};\n\nstruct No* inserirInicio(struct No *cabeca, int valor) {\n    struct No *novo = malloc(sizeof(struct No));\n    novo->valor = valor;\n    novo->prox = cabeca;\n    return novo;\n}\n\nint main() {\n    struct No *lista = NULL;\n    lista = inserirInicio(lista, 3);\n    lista = inserirInicio(lista, 2);\n    lista = inserirInicio(lista, 1);\n\n    for (struct No *p = lista; p != NULL; p = p->prox) {\n        printf(\"%d \", p->valor);\n    }\n    printf(\"\\n\");\n    return 0;\n}" },

        { enunciado: "Escreva uma função que implementa o algoritmo Quicksort para ordenar um vetor de inteiros.", resolucao: "#include <stdio.h>\n\nvoid trocar(int *a, int *b) {\n    int tmp = *a; *a = *b; *b = tmp;\n}\n\nint particionar(int v[], int inicio, int fim) {\n    int pivo = v[fim], i = inicio - 1;\n    for (int j = inicio; j < fim; j++) {\n        if (v[j] < pivo) {\n            i++;\n            trocar(&v[i], &v[j]);\n        }\n    }\n    trocar(&v[i + 1], &v[fim]);\n    return i + 1;\n}\n\nvoid quicksort(int v[], int inicio, int fim) {\n    if (inicio < fim) {\n        int p = particionar(v, inicio, fim);\n        quicksort(v, inicio, p - 1);\n        quicksort(v, p + 1, fim);\n    }\n}\n\nint main() {\n    int v[] = {8, 3, 1, 9, 5};\n    quicksort(v, 0, 4);\n    for (int i = 0; i < 5; i++) printf(\"%d \", v[i]);\n    printf(\"\\n\");\n    return 0;\n}" },

const NIVEL_LABEL = { facil: "Fácil", intermediario: "Intermediário", dificil: "Difícil" };

// ---------- Estado / progresso ----------
let materiaSelId = localStorage.getItem("ex_materia_sel") || MATERIAS[0].id;
let nivelSel = localStorage.getItem("ex_nivel_sel") || "facil";

function getProgresso() {
  return loadJSON("tape_exercicios_progresso", {});
}
function marcarFeito(chave, feito) {
  const prog = getProgresso();
  prog[chave] = feito;
  saveJSON("tape_exercicios_progresso", prog);
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderSubjectTabs() {
  const el = document.getElementById("exSubjectTabs");
  el.innerHTML = MATERIAS.map(
    (m) => `<button data-id="${m.id}" class="${m.id === materiaSelId ? "active" : ""}">${m.nome}</button>`
  ).join("");
  el.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      materiaSelId = btn.dataset.id;
      localStorage.setItem("ex_materia_sel", materiaSelId);
      renderSubjectTabs();
      renderLista();
    });
  });
}

function renderLevelTabs() {
  const el = document.getElementById("exLevelTabs");
  el.innerHTML = Object.keys(NIVEL_LABEL)
    .map(
      (n) => `<button data-nivel="${n}" class="${n}${n === nivelSel ? " active" : ""}">${NIVEL_LABEL[n]}</button>`
    )
    .join("");
  el.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      nivelSel = btn.dataset.nivel;
      localStorage.setItem("ex_nivel_sel", nivelSel);
      renderLevelTabs();
      renderLista();
    });
  });
}

function renderLista() {
  const materia = MATERIAS.find((m) => m.id === materiaSelId) || MATERIAS[0];
  const lista = materia.niveis[nivelSel] || [];
  const prog = getProgresso();
  const listEl = document.getElementById("exList");

  listEl.innerHTML = lista
    .map((ex, i) => {
      const chave = `${materia.id}_${nivelSel}_${i}`;
      const acertou = !!prog[chave];

      if (materia.tipo === "mc") {
        const opcoesHtml = ex.opcoes
          .map((op, oi) => `<button class="ex-opcao" data-oi="${oi}">${escapeHtml(op)}</button>`)
          .join("");
        return `
        <div class="ex-item${acertou ? " acertou" : ""}" data-chave="${chave}" data-correta="${ex.correta}">
          <div class="ex-item-top">
            <span class="ex-item-num">${i + 1}</span>
            <span class="ex-item-enunciado">${escapeHtml(ex.enunciado)}</span>
          </div>
          <div class="ex-opcoes">${opcoesHtml}</div>
          <button class="ex-resolucao-btn" data-aberto="0">Ver resolução</button>
          <div class="ex-resolucao"><strong>Resolução</strong>${escapeHtml(ex.resolucao)}</div>
        </div>`;
      }

      // tipo "codigo"
      return `
      <div class="ex-item${acertou ? " acertou" : ""}" data-chave="${chave}">
        <div class="ex-item-top">
          <span class="ex-item-num">${i + 1}</span>
          <span class="ex-item-enunciado">${escapeHtml(ex.enunciado)}</span>
        </div>
        <button class="ex-resolucao-btn" data-aberto="0">Ver resolução (código sugerido)</button>
        <div class="ex-resolucao"><strong>Resolução</strong><pre>${escapeHtml(ex.resolucao)}</pre></div>
        <div class="ex-item-check-row">
          <input type="checkbox" ${acertou ? "checked" : ""}>
          <span>Já resolvi esse</span>
        </div>
      </div>`;
    })
    .join("");

  // Múltipla escolha: clique numa opção
  listEl.querySelectorAll(".ex-item").forEach((item) => {
    const chave = item.dataset.chave;
    const opcoesEl = item.querySelectorAll(".ex-opcao");
    if (opcoesEl.length) {
      const correta = Number(item.dataset.correta);
      opcoesEl.forEach((btn) => {
        btn.addEventListener("click", () => {
          if (item.classList.contains("respondido")) return;
          item.classList.add("respondido");
          const escolhida = Number(btn.dataset.oi);
          opcoesEl.forEach((b) => (b.disabled = true));
          if (escolhida === correta) {
            btn.classList.add("correta-marcada");
            item.classList.add("acertou");
            marcarFeito(chave, true);
            if (window.ganharXP) window.ganharXP(5);
            if (window.tapeRegistrarAcao) window.tapeRegistrarAcao("exercicio_acertou");
          } else {
            btn.classList.add("errada-marcada");
            opcoesEl[correta].classList.add("correta-marcada");
          }
          renderProgresso();
        });
      });
    }

    // checkbox manual (exercícios de código)
    const checkbox = item.querySelector(".ex-item-check-row input");
    if (checkbox) {
      checkbox.addEventListener("change", () => {
        marcarFeito(chave, checkbox.checked);
        item.classList.toggle("acertou", checkbox.checked);
        if (checkbox.checked && window.ganharXP) window.ganharXP(5);
        renderProgresso();
      });
    }

    // botão "ver resolução"
    const resBtn = item.querySelector(".ex-resolucao-btn");
    const resDiv = item.querySelector(".ex-resolucao");
    resBtn.addEventListener("click", () => {
      const aberta = resDiv.classList.toggle("aberta");
      resBtn.textContent = aberta
        ? "Esconder resolução"
        : (materia.tipo === "codigo" ? "Ver resolução (código sugerido)" : "Ver resolução");
    });
  });

  renderProgresso();
}

function renderProgresso() {
  const materia = MATERIAS.find((m) => m.id === materiaSelId) || MATERIAS[0];
  const lista = materia.niveis[nivelSel] || [];
  const prog = getProgresso();
  const total = lista.length;
  const feitos = lista.filter((_, i) => prog[`${materia.id}_${nivelSel}_${i}`]).length;
  const pct = total ? Math.round((feitos / total) * 100) : 0;
  document.getElementById("exProgressoFill").style.width = pct + "%";
  document.getElementById("exProgressoTexto").textContent = total
    ? `${feitos}/${total} exercícios resolvidos neste nível (${pct}%)`
    : "";
}

renderSubjectTabs();
renderLevelTabs();
renderLista();
</script>
