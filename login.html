<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tape · Acesso</title>
  <style>
    :root {
      --paper: #F5F4F0;
      --ink: #26241F;
      --line: #00000014;
      --accent: #B65C38;
      --accent-2: #D89B4A;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 36px 32px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 380px;
      border: 1px solid var(--line);
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 6px;
    }
    .brand-row span.brand-text {
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
    }
    .tagline {
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.5;
      margin-bottom: 26px;
    }
    h2 {
      margin: 0 0 4px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      opacity: 0.85;
    }
    label {
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.5;
      display: block;
      margin-top: 16px;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #00000006;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--ink);
    }
    input:focus { outline: 2px solid var(--accent-2); background: white; }
    .btn-container {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: filter .15s ease;
    }
    button:hover { filter: brightness(0.95); }
    .btn-entrar {
      background-color: var(--ink);
      color: var(--paper);
    }
    .btn-cadastrar {
      background-color: transparent;
      color: var(--ink);
      border: 1.5px solid var(--line);
    }
    .legal {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      opacity: 0.45;
      line-height: 1.5;
    }
    .legal a { color: var(--accent); text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand-row">
      <svg width="34" height="34" viewBox="0 0 200 200" style="flex-shrink:0">
        <rect width="200" height="200" rx="40" fill="#F1E6CF"/>
        <circle cx="100" cy="46" r="7" fill="#8C3B2E"/>
        <polyline points="38,146 100,92 162,146" fill="none" stroke="#B65C38" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="55,119 100,77 145,119" fill="none" stroke="#D89B4A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="72,92 100,64 128,92" fill="none" stroke="#56705A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text">tape</span>
    </div>
    <div class="tagline">caderno acadêmico</div>

    <h2>Acesse sua conta</h2>

    <label for="emailInput">E-mail</label>
    <input type="email" id="emailInput" placeholder="seuemail@exemplo.com" required>

    <label for="senhaInput">Senha</label>
    <input type="password" id="senhaInput" placeholder="Digite sua senha" required>

    <div class="btn-container">
      <button id="btnEntrar" class="btn-entrar">Entrar</button>
      <button id="btnCadastrar" class="btn-cadastrar">Criar nova conta</button>
    </div>

    <div class="legal">
      Ao continuar, você concorda com os<br>
      <a href="#" id="linkTermosLogin">Cookies e Termos de uso</a> do tape.
    </div>
  </div>

  <script type="module" src="auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("linkTermosLogin")?.addEventListener("click", (e) => {
        e.preventDefault();
        window.showTapeTerms && window.showTapeTerms();
      });
    });
  </script>
</body>
</html>
