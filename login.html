<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>tape · Acesso</title>
  <style>
    :root {
  color-scheme: only light;
      --paper: #FBF3E6;
      --ink: #1A1712;
      --line: #00000014;
      --card: #FFFCF5;
      --overlay: #00000008;
      --overlay-2: #00000010;
      --accent: #B5502E;
      --accent-2: #D89B4A;
    }
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      gap: 4px;
    }
    #tapeCopyright { width: 100%; }
    .card {
      background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14);
      padding: 36px 32px;
      border-radius: 20px;
      box-shadow: 0 10px 32px -10px rgba(30,25,18,0.18);
      width: 100%;
      max-width: 380px;
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      margin-bottom: 8px;
    }
    .brand-row span.brand-text {
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 0.03em;
      text-transform: capitalize;
      color: var(--ink);
    }
    @supports (background-clip: text) or (-webkit-background-clip: text) {
      .brand-row span.brand-text {
        background: linear-gradient(120deg, #B5502E, #D9A441 55%, #C97B63);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
      }
    }
    .tagline {
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.5;
      margin-top: 4px;
      margin-bottom: 26px;
    }
    h2 {
      margin: 0 0 4px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      opacity: 0.85;
    }
    label {
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.5;
      display: block;
      margin-top: 16px;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #00000006;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--ink);
    }
    input:focus { outline: 2px solid var(--accent-2); background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14); }
    .btn-container {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: filter .15s ease;
    }
    button:hover { filter: brightness(0.95); }
    .btn-entrar {
      background-color: var(--ink);
      color: var(--paper);
    }
    .btn-cadastrar {
      background-color: transparent;
      color: var(--ink);
      border: 1.5px solid var(--line);
    }
    .legal {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      opacity: 0.45;
      line-height: 1.5;
    }
    .legal a { color: var(--accent); text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
        <div class="brand-row">
      <svg width="34" height="34" viewBox="0 0 200 200" style="flex-shrink:0">
        <rect width="200" height="200" rx="40" fill="#F1E6CF"/>
        <circle cx="100" cy="46" r="7" fill="#8C3B2E"/>
        <polyline points="38,146 100,92 162,146" fill="none" stroke="#B65C38" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="55,119 100,77 145,119" fill="none" stroke="#D89B4A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="72,92 100,64 128,92" fill="none" stroke="#56705A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text">tape</span>
    </div>
    <div class="tagline">caderno acadêmico</div>

    <h2>Acesse sua conta</h2>

    <label for="emailInput">E-mail</label>
    <input type="email" id="emailInput" placeholder="seuemail@exemplo.com" required>

    <label for="senhaInput">Senha</label>
    <input type="password" id="senhaInput" placeholder="Digite sua senha" required>

    <div class="btn-container">
      <button id="btnEntrar" class="btn-entrar">Entrar</button>
      <button id="btnCadastrar" class="btn-cadastrar">Criar nova conta</button>
    </div>

    <div class="legal">
      Ao continuar, você concorda com os<br>
      <a href="#" id="linkTermosLogin">Cookies e Termos de uso</a> do tape.
    </div>
  </div>

  <script type="module" src="auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("linkTermosLogin")?.addEventListener("click", (e) => {
        e.preventDefault();
        window.showTapeTerms && window.showTapeTerms();
      });
    });
  </script>
</body>
</html>
