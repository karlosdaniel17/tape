<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Aulas</title>
<style>
:root {
  --paper: #FAFAF8;
  --ink: #2E2B24;
  --line: #00000014;
  --seg: #FF6B6B;
  --ter: #FF9F43;
  --qua: #F4C430;
  --qui: #4CAF7D;
  --sex: #4D96FF;
  --sab: #A78BFA;
  --dom: #FF6FB5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
a { color: inherit; text-decoration: none; }

.topbar { border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 10; }
.topbar-inner { max-width: 1100px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.brand { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.brand span.brand-text { font-weight: 800; font-size: 1.05em; letter-spacing: 0.03em; text-transform: capitalize; }
nav.mainnav { display: flex; gap: 4px; flex-wrap: wrap; }
nav.mainnav a { font-size: 0.85rem; font-weight: 600; padding: 8px 14px; border-radius: 999px; opacity: 0.55; transition: all .15s ease; }
nav.mainnav a:hover { opacity: 0.85; background: #00000008; }
nav.mainnav a.active { opacity: 1; background: var(--ink); color: var(--paper); }
.lang-switch { flex-shrink: 0; }

main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
.eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.65; margin-bottom: 4px; }
h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; }
.lead { opacity: 0.6; font-size: 0.92rem; line-height: 1.5; margin: 0 0 24px; }

.week-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.day-col { background: white; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.day-col-head { padding: 12px 14px; color: white; display: flex; align-items: center; justify-content: space-between; }
.day-col-head .name { font-weight: 800; font-size: 1rem; }
.day-col-head button {
  width: 26px; height: 26px; border-radius: 999px; border: none; background: rgba(255,255,255,0.25);
  color: white; cursor: pointer; font-weight: 700; font-size: 1rem; flex-shrink: 0;
}
.day-col-body { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
.aula-empty { font-size: 0.78rem; opacity: 0.4; padding: 6px 0; }
.aula-item { background: #00000006; border-radius: 10px; padding: 9px 11px; border-left: 3px solid; }
.aula-item .aula-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.aula-item .aula-nome { font-weight: 700; font-size: 0.88rem; }
.aula-item .aula-tipo-badge {
  font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  padding: 2px 7px; border-radius: 999px; background: #00000010; opacity: 0.65; flex-shrink: 0;
}
.aula-item .rm { border: none; background: none; opacity: 0.3; cursor: pointer; font-size: 0.8rem; flex-shrink: 0; }
.aula-item .rm:hover { opacity: 0.9; }
.aula-item .aula-meta { font-size: 0.72rem; opacity: 0.55; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
.aula-form select.tipo-select { font-weight: 700; }

.aula-form { display: flex; flex-direction: column; gap: 6px; padding: 10px; background: #00000006; border-radius: 10px; }
.aula-form input, .aula-form select {
  font-size: 0.82rem; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: white; color: var(--ink);
  width: 100%; font-family: inherit;
}
.aula-form .time-row { display: flex; gap: 6px; }
.aula-form .time-row input { flex: 1; min-width: 0; }
.aula-form .actions { display: flex; gap: 6px; margin-top: 2px; }
.aula-form .actions button {
  flex: 1; font-size: 0.78rem; font-weight: 700; border: none; border-radius: 8px; padding: 7px 0; cursor: pointer;
}
.aula-form .btn-confirm { background: var(--ink); color: white; }
.aula-form .btn-cancel { background: none; opacity: 0.5; }
.aula-add-btn {
  border: 1px dashed var(--line); background: none; border-radius: 10px; padding: 8px; font-size: 0.8rem;
  font-weight: 700; opacity: 0.55; cursor: pointer;
}
.aula-add-btn:hover { opacity: 1; background: #00000006; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="brand"></div>
    <nav class="mainnav" id="mainnav"></nav>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="lang-switch" id="langSwitch"></div>
      <div id="authBox"></div>
    </div>
  </div>
</div>

<main>
  <div class="eyebrow">Agenda recorrente</div>
  <h1>Aulas</h1>
  <p class="lead">Cadastre o horário, a sala e o dia da semana de cada aula — elas se repetem automaticamente toda semana, como uma agenda.</p>

  <div class="week-grid" id="weekGrid"></div>
</main>

<footer style="text-align:center;font-size:11px;opacity:.35;padding:30px 20px" id="txtFooter">Seus dados ficam salvos automaticamente neste navegador.</footer>

<script>
const SITE_NAME = "tape";
document.title = SITE_NAME + " · Aulas";
document.getElementById("brand").innerHTML = `<svg width="30" height="30" viewBox="0 0 200 200" style="flex-shrink:0"><rect width="200" height="200" rx="40" fill="#F1E6CF"/><circle cx="100" cy="46" r="7" fill="#8C3B2E"/><polyline points="38,146 100,92 162,146" fill="none" stroke="#B65C38" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><polyline points="55,119 100,77 145,119" fill="none" stroke="#D89B4A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><polyline points="72,92 100,64 128,92" fill="none" stroke="#56705A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand-text">${SITE_NAME}</span>`;

const NAV_LINKS = [
  { href: "index.html", label: "Semana" },
  { href: "disciplinas.html", label: "Disciplinas" },
  { href: "anotacoes.html", label: "Anotações" },
  { href: "estudos.html", label: "Estudos extras" },
  { href: "aulas.html", label: "Aulas" },
  { href: "formulas.html", label: "Guia de sobrevivência" },
  { href: "foco.html", label: "Foco" },
  { href: "calculadora.html", label: "Calculadora" },
  { href: "perfil.html", label: "Perfil" },
  { href: "ajuda.html", label: "Ajuda" },
  { href: "sugestoes.html", label: "Sugestões" },
  { href: "creditos.html", label: "Créditos" },
];
document.getElementById("mainnav").innerHTML = NAV_LINKS
  .map(l => `<a href="${l.href}" class="${l.href === "aulas.html" ? "active" : ""}">${l.label}</a>`)
  .join("");

const langs = [["pt","Português"],["en","English"],["es","Español"]];
const currentLang = localStorage.getItem("idioma") || "pt";
document.getElementById("langSwitch").innerHTML = `
  <div class="lang-dropdown" style="position:relative">
    <button id="langToggleBtn" style="display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:white;cursor:pointer;color:var(--ink)">🌐 ${currentLang.toUpperCase()} <span style="font-size:9px;opacity:.5">▾</span></button>
    <div id="langMenu" style="position:absolute;top:calc(100% + 8px);right:0;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);overflow:hidden;min-width:150px;display:none;z-index:30">
      ${langs.map(([code, name]) => `<button data-lang="${code}" style="width:100%;text-align:left;padding:10px 14px;border:none;background:white;font-size:.85rem;cursor:pointer;display:block;color:var(--ink)">${name}</button>`).join("")}
    </div>
  </div>`;
document.getElementById("langToggleBtn").addEventListener("click", (e) => { e.stopPropagation(); document.getElementById("langMenu").style.display = document.getElementById("langMenu").style.display === "block" ? "none" : "block"; });
document.querySelectorAll("#langMenu button").forEach(b => b.addEventListener("click", () => { localStorage.setItem("idioma", b.dataset.lang); location.href = "index.html"; }));
document.addEventListener("click", () => { const m = document.getElementById("langMenu"); if (m) m.style.display = "none"; });

// ---------- localStorage helpers ----------
function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { return false; }
}
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

// ---------- disciplinas (pra reaproveitar nomes/cores já cadastrados) ----------
function getDisciplinas() { return loadJSON("disciplinas", []); }

const DAY_DEFS = [
  { key: "seg", label: "Segunda", css: "--seg" },
  { key: "ter", label: "Terça", css: "--ter" },
  { key: "qua", label: "Quarta", css: "--qua" },
  { key: "qui", label: "Quinta", css: "--qui" },
  { key: "sex", label: "Sexta", css: "--sex" },
  { key: "sab", label: "Sábado", css: "--sab" },
  { key: "dom", label: "Domingo", css: "--dom" },
];

function getAulas() {
  const data = loadJSON("aulas_horario", null);
  if (data) return data;
  const empty = {};
  DAY_DEFS.forEach(d => { empty[d.key] = []; });
  saveJSON("aulas_horario", empty);
  return empty;
}
function saveAulas(data) {
  saveJSON("aulas_horario", data);
  if (window.pushAulasToCloud) window.pushAulasToCloud(data);
}

let openFormDay = null;

function render() {
  const data = getAulas();
  const grid = document.getElementById("weekGrid");
  grid.innerHTML = "";

  DAY_DEFS.forEach(day => {
    const col = document.createElement("div");
    col.className = "day-col";

    const head = document.createElement("div");
    head.className = "day-col-head";
    head.style.background = `var(${day.css})`;
    const nm = document.createElement("span");
    nm.className = "name"; nm.textContent = day.label;
    head.appendChild(nm);
    const addBtn = document.createElement("button");
    addBtn.textContent = "+";
    addBtn.title = "Adicionar aula neste dia";
    addBtn.addEventListener("click", () => { openFormDay = openFormDay === day.key ? null : day.key; render(); });
    head.appendChild(addBtn);
    col.appendChild(head);

    const body = document.createElement("div");
    body.className = "day-col-body";

    const items = [...data[day.key]].sort((a, b) => (a.inicio || "").localeCompare(b.inicio || ""));
    if (items.length === 0) {
      const e = document.createElement("div");
      e.className = "aula-empty";
      e.textContent = "Nenhuma aula cadastrada";
      body.appendChild(e);
    }
    items.forEach(it => {
      const row = document.createElement("div");
      row.className = "aula-item";
      row.style.borderLeftColor = it.cor || `var(${day.css})`;
      const top = document.createElement("div");
      top.className = "aula-top";
      const nome = document.createElement("span");
      nome.className = "aula-nome"; nome.textContent = it.nome;
      top.appendChild(nome);
      if (it.tipo && it.tipo !== "Aula") {
        const badge = document.createElement("span");
        badge.className = "aula-tipo-badge";
        badge.textContent = it.tipo;
        top.appendChild(badge);
      }
      const rm = document.createElement("button");
      rm.className = "rm"; rm.textContent = "×";
      rm.addEventListener("click", () => {
        data[day.key] = data[day.key].filter(x => x.id !== it.id);
        saveAulas(data);
        render();
      });
      top.appendChild(rm);
      row.appendChild(top);

      const meta = document.createElement("div");
      meta.className = "aula-meta";
      const partes = [];
      if (it.inicio) partes.push(it.fim ? `${it.inicio}–${it.fim}` : it.inicio);
      if (it.sala) partes.push("sala " + it.sala);
      meta.textContent = partes.join(" · ");
      if (partes.length) row.appendChild(meta);

      body.appendChild(row);
    });

    if (openFormDay === day.key) {
      const form = document.createElement("div");
      form.className = "aula-form";

      const tipoInput = document.createElement("select");
      tipoInput.className = "tipo-select";
      ["Aula", "Monitoria", "Projeto", "Outro"].forEach(tp => {
        const opt = document.createElement("option");
        opt.value = tp; opt.textContent = tp;
        tipoInput.appendChild(opt);
      });
      form.appendChild(tipoInput);

      const disciplinas = getDisciplinas();
      let nomeInput;
      if (disciplinas.length > 0) {
        nomeInput = document.createElement("select");
        const optLivre = document.createElement("option");
        optLivre.value = ""; optLivre.textContent = "— escolha a disciplina ou digite livre —";
        nomeInput.appendChild(optLivre);
        disciplinas.forEach(d => {
          const opt = document.createElement("option");
          opt.value = d.name; opt.dataset.color = d.color; opt.textContent = d.name;
          nomeInput.appendChild(opt);
        });
        const optOutro = document.createElement("option");
        optOutro.value = "__livre__"; optOutro.textContent = "Outro (digitar nome)";
        nomeInput.appendChild(optOutro);
      }
      const nomeLivre = document.createElement("input");
      nomeLivre.type = "text"; nomeLivre.placeholder = "Nome (ex.: Monitoria de Cálculo)";
      if (disciplinas.length > 0) nomeLivre.style.display = "none";

      if (nomeInput) {
        nomeInput.addEventListener("change", () => {
          nomeLivre.style.display = nomeInput.value === "__livre__" ? "" : "none";
        });
        form.appendChild(nomeInput);
      }
      form.appendChild(nomeLivre);

      const salaInput = document.createElement("input");
      salaInput.type = "text"; salaInput.placeholder = "Sala / local";
      form.appendChild(salaInput);

      const timeRow = document.createElement("div");
      timeRow.className = "time-row";
      const inicioInput = document.createElement("input");
      inicioInput.type = "time";
      const fimInput = document.createElement("input");
      fimInput.type = "time";
      timeRow.appendChild(inicioInput);
      timeRow.appendChild(fimInput);
      form.appendChild(timeRow);

      const actions = document.createElement("div");
      actions.className = "actions";
      const confirmBtn = document.createElement("button");
      confirmBtn.className = "btn-confirm"; confirmBtn.textContent = "Adicionar";
      confirmBtn.addEventListener("click", () => {
        let nome = "";
        let cor = null;
        if (nomeInput && nomeInput.value && nomeInput.value !== "__livre__") {
          nome = nomeInput.value;
          const opt = nomeInput.selectedOptions[0];
          cor = opt ? opt.dataset.color : null;
        } else {
          nome = nomeLivre.value.trim();
        }
        if (!nome) return;
        data[day.key].push({
          id: uid(), tipo: tipoInput.value, nome, sala: salaInput.value.trim(),
          inicio: inicioInput.value || "", fim: fimInput.value || "", cor: cor || null,
        });
        saveAulas(data);
        openFormDay = null;
        render();
      });
      const cancelBtn = document.createElement("button");
      cancelBtn.className = "btn-cancel"; cancelBtn.textContent = "Cancelar";
      cancelBtn.addEventListener("click", () => { openFormDay = null; render(); });
      actions.appendChild(confirmBtn);
      actions.appendChild(cancelBtn);
      form.appendChild(actions);

      body.appendChild(form);
    } else {
      const addBtn2 = document.createElement("button");
      addBtn2.className = "aula-add-btn";
      addBtn2.textContent = "+ aula";
      addBtn2.addEventListener("click", () => { openFormDay = day.key; render(); });
      body.appendChild(addBtn2);
    }

    col.appendChild(body);
    grid.appendChild(col);
  });
}

render();
</script>
<script type="module" src="auth.js"></script>
<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAnv0eey-idqfBf8hVLvQ-0IMtoF4RXnkc",
  authDomain: "tape-1717.firebaseapp.com",
  projectId: "tape-1717",
  storageBucket: "tape-1717.firebasestorage.app",
  messagingSenderId: "244010846598",
  appId: "1:244010846598:web:e704631b12d4137fdcc407"
};
const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let cloudUid = null;

async function pullAulasFromCloud(uid) {
  try {
    const ref = doc(db, "usuarios", uid, "dados", "aulas_horario");
    const snap = await getDoc(ref);
    if (snap.exists() && snap.data().aulas) {
      localStorage.setItem("aulas_horario", JSON.stringify(snap.data().aulas));
    } else {
      const local = JSON.parse(localStorage.getItem("aulas_horario") || "null");
      if (local) await setDoc(ref, { aulas: local, atualizadoEm: Date.now() });
    }
  } catch (e) {
    console.error("tape: erro ao sincronizar aulas", e);
  }
  if (typeof render === "function") render();
}

window.pushAulasToCloud = async function (aulas) {
  if (!cloudUid) return;
  try {
    await setDoc(doc(db, "usuarios", cloudUid, "dados", "aulas_horario"), { aulas, atualizadoEm: Date.now() });
  } catch (e) {
    console.error("tape: erro ao salvar aulas na nuvem", e);
  }
};

let jaSincronizou = false;
onAuthStateChanged(auth, (user) => {
  cloudUid = user ? user.uid : null;
  if (cloudUid && !jaSincronizou) {
    jaSincronizou = true;
    pullAulasFromCloud(cloudUid);
  }
});
</script>
<script src="assistente.js" defer></script>
</body>
</html>
