<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semana - tape</title>
<style>
:root {
  --paper: #F5F4F0;
  --ink: #26241F;
  --line: #00000014;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

a { color: inherit; text-decoration: none; }

.topbar {
  border-bottom: 1px solid var(--line);
  background: var(--paper);
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.brand {
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand span { opacity: 0.4; font-weight: 500; font-size: 0.8em; }
nav.mainnav { display: flex; gap: 4px; flex-wrap: wrap; }
nav.mainnav a {
  font-size: 0.85rem;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 999px;
  opacity: 0.55;
  transition: all .15s ease;
}
nav.mainnav a:hover { opacity: 0.85; background: #00000008; }
nav.mainnav a.active { opacity: 1; background: var(--ink); color: var(--paper); }

main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }

.eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.5; margin-bottom: 4px; }
h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 16px; }

.grid-semana {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}

.card-materia {
  background: white;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
}

.card-materia .codigo {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  background: #0000000a;
  margin-bottom: 8px;
}

.card-materia h3 { margin: 0 0 6px; font-size: 1.1rem; }
.card-materia p { margin: 2px 0; font-size: 0.85rem; opacity: 0.7; }

footer.foot { text-align: center; font-size: 11px; opacity: 0.35; padding: 30px 20px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">tape <span>caderno acadêmico</span></div>
    <nav class="mainnav">
      <a href="index.html" class="active">Semana</a>
      <a href="disciplinas.html">Disciplinas</a>
      <a href="anotacoes.html">Anotações</a>
      <a href="estudos.html">Estudos extras</a>
    </nav>
  </div>
</div>

<main>
  <div class="eyebrow">Visão Geral</div>
  <h1>Grade Semanal</h1>

  <div id="gridSemana" class="grid-semana">
    <p style="opacity: 0.5;">Carregando disciplinas...</p>
  </div>
</main>

<footer class="foot">Seus dados ficam salvos em tempo real na nuvem do Google.</footer>

<script type="module">
  import { auth, db } from './auth.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  let disciplinas = [];

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      try {
        const docRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists() && docSnap.data().disciplinas) {
          disciplinas = docSnap.data().disciplinas;
        } else {
          disciplinas = JSON.parse(localStorage.getItem("disciplinas") || "[]");
        }
      } catch (e) {
        disciplinas = JSON.parse(localStorage.getItem("disciplinas") || "[]");
      }
    } else {
      disciplinas = JSON.parse(localStorage.getItem("disciplinas") || "[]");
    }
    renderSemana();
  });

  function renderSemana() {
    const container = document.getElementById("gridSemana");
    container.innerHTML = "";

    if (disciplinas.length === 0) {
      container.innerHTML = `<p style="opacity:0.5;">Nenhuma disciplina cadastrada para exibir na semana. Cadastre em "Disciplinas".</p>`;
      return;
    }

    disciplinas.forEach(d => {
      const card = document.createElement("div");
      card.className = "card-materia";
      card.style.borderLeft = `5px solid ${d.cor || '#FF6B6B'}`;

      card.innerHTML = `
        ${d.codigo ? `<span class="codigo">${d.codigo}</span>` : ''}
        <h3>${d.nome || 'Sem nome'}</h3>
        ${d.horario ? `<p><strong>Horário:</strong> ${d.horario}</p>` : ''}
        ${d.sala ? `<p><strong>Sala:</strong> ${d.sala}</p>` : ''}
        ${d.prof ? `<p><strong>Professor(a):</strong> ${d.prof}</p>` : ''}
      `;
      container.appendChild(card);
    });
  }
</script>
</body>
</html>
