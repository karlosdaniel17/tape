<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semana</title>
<style>
:root {
  --paper: #F5F4F0;
  --ink: #26241F;
  --line: #00000014;
  --seg: #FF6B6B;
  --ter: #FF9F43;
  --qua: #F4C430;
  --qui: #4CAF7D;
  --sex: #4D96FF;
  --sab: #A78BFA;
  --dom: #FF6FB5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

a { color: inherit; text-decoration: none; }

/* ---------- Navbar ---------- */
.topbar {
  border-bottom: 1px solid var(--line);
  background: var(--paper);
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.brand {
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand span { opacity: 0.4; font-weight: 500; font-size: 0.8em; }
.brand span.brand-text { opacity: 1; font-weight: 800; font-size: 1em; letter-spacing: -0.02em; }
nav.mainnav { display: flex; gap: 4px; flex-wrap: wrap; }
nav.mainnav a {
  font-size: 0.85rem;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 999px;
  opacity: 0.55;
  transition: all .15s ease;
}
nav.mainnav a:hover { opacity: 0.85; background: #00000008; }
nav.mainnav a.active { opacity: 1; background: var(--ink); color: var(--paper); }

.lang-dropdown { position: relative; }
.lang-toggle {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.78rem; font-weight: 700; padding: 7px 13px; border-radius: 999px;
  border: 1px solid var(--line); background: white; cursor: pointer; color: var(--ink);
}
.lang-toggle:hover { background: #00000008; }
.lang-toggle .caret { font-size: 9px; opacity: 0.5; }
.lang-menu {
  position: absolute; top: calc(100% + 8px); right: 0;
  background: white; border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden;
  min-width: 150px; display: none; z-index: 30;
}
.lang-menu.open { display: block; }
.lang-menu button {
  width: 100%; text-align: left; padding: 10px 14px; border: none; background: white;
  font-size: 0.85rem; cursor: pointer; display: block; color: var(--ink);
}
.lang-menu button:hover { background: #00000008; }
.lang-menu button.active { font-weight: 800; background: #00000006; }


main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
@media (max-width: 480px) {
  main { padding: 18px 12px 50px; }
  h1 { font-size: 1.5rem; }
  .topbar-inner { padding: 12px 14px; }
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0.5;
  margin-bottom: 4px;
}
h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; }

/* ---------- Week nav ---------- */
.weeknav {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 18px 0 20px;
}
.weeknav button {
  width: 34px; height: 34px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: white;
  cursor: pointer;
  font-size: 1rem;
}
.weeknav button:hover { background: #00000008; }
.weekrange { font-size: 0.9rem; font-weight: 600; padding: 6px 14px; border-radius: 999px; background: #00000008; }
.today-link { font-size: 0.8rem; opacity: 0.55; text-decoration: underline; cursor: pointer; background: none; border: none; }

/* ---------- Disciplinas chips ---------- */
.disc-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 26px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 6px 6px 12px;
  border-radius: 999px;
  font-size: 0.85rem; font-weight: 600;
  cursor: grab;
  user-select: none;
}
.chip button {
  border: none; width: 16px; height: 16px; border-radius: 999px;
  font-size: 11px; cursor: pointer; opacity: 0.5;
}
.chip button:hover { opacity: 1; }
.chip { position: relative; }
.day-popover {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 25;
  background: white; border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 6px; min-width: 130px;
  display: flex; flex-direction: column; gap: 2px;
}
.day-popover button {
  border: none; background: none; text-align: left; padding: 7px 10px; border-radius: 8px;
  font-size: 0.82rem; cursor: pointer; color: var(--ink); opacity: 0.85;
}
.day-popover button:hover { background: #00000008; opacity: 1; }
.add-disc { display: inline-flex; gap: 6px; }
.add-disc input {
  font-size: 0.85rem; padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--line); width: 150px;
}
.add-disc button {
  width: 32px; height: 32px; border-radius: 999px; border: none;
  background: var(--ink); color: white; cursor: pointer; font-size: 1rem;
}

/* ---------- Day grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
@media (max-width: 380px) {
  .grid { grid-template-columns: 1fr; }
}

.day-card { background: white; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.day-head {
  padding: 12px 16px; color: white; display: flex; align-items: center; justify-content: space-between;
}
.day-head .date { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.85; }
.day-head .name { font-size: 1.1rem; font-weight: 800; }
.day-head button {
  width: 26px; height: 26px; border-radius: 999px; border: none;
  background: rgba(255,255,255,0.25); color: white; cursor: pointer; font-weight: 700;
}
.day-addlist { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px; }
.day-addlist button { font-size: 0.75rem; padding: 5px 10px; border-radius: 999px; border: 1px solid; background: white; cursor: pointer; }

.day-schedule { padding: 10px 14px 6px; display: flex; flex-direction: column; gap: 6px; min-height: 30px; }
.sched-empty { font-size: 0.78rem; opacity: 0.4; padding: 4px 0; }
.sched-item {
  display: flex; align-items: center; gap: 8px;
  background: white; border-radius: 10px; padding: 6px 10px;
  cursor: grab;
}
.sched-item .dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
.sched-item .nm { flex: 1; font-size: 0.85rem; font-weight: 600; }
.sched-item input { width: 52px; font-size: 0.75rem; text-align: right; border: none; background: transparent; opacity: 0.7; }
.sched-item .rm { border: none; background: none; opacity: 0.3; cursor: pointer; font-size: 0.8rem; }
.sched-item .rm:hover { opacity: 0.8; }

.day-body { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); }
.field-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.45; margin-bottom: 5px; }
textarea, .textinput {
  width: 100%; border: none; background: #00000006; border-radius: 10px;
  padding: 8px 10px; font-size: 0.85rem; font-family: inherit; resize: vertical;
}
textarea:focus, .textinput:focus { outline: 2px solid #00000022; }

.task-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
.task-row span.done { opacity: 0.4; text-decoration: line-through; }
.task-row .rm { margin-left: auto; border: none; background: none; opacity: 0; cursor: pointer; }
.task-row:hover .rm { opacity: 0.4; }
.task-row .rm:hover { opacity: 1; }
.task-add { display: flex; gap: 6px; margin-top: 2px; }
.task-add input { flex: 1; font-size: 0.85rem; border: none; background: #00000006; border-radius: 8px; padding: 6px 10px; }

/* ---------- Disciplinas page ---------- */
.disc-card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.disc-card .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.disc-card input.small { flex: 1; min-width: 140px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 0.9rem; }
.disc-card textarea { min-height: 60px; }
.disc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.disc-name { font-weight: 800; font-size: 1.05rem; }
.del-btn { border: none; background: none; color: #B33; cursor: pointer; font-size: 0.8rem; opacity: 0.6; }
.del-btn:hover { opacity: 1; }
.new-disc-btn {
  padding: 10px 18px; border-radius: 999px; border: none; background: var(--ink); color: white;
  font-size: 0.85rem; font-weight: 700; cursor: pointer;
}

/* ---------- Anotacoes page ---------- */
.notes-wrap { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
@media (max-width: 800px) { .notes-wrap { grid-template-columns: 1fr; } }
.notes-wrap textarea { min-height: 460px; font-size: 0.95rem; line-height: 1.5; }
.calc-box { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 16px; height: fit-content; }
.calc-display { font-size: 1.4rem; text-align: right; padding: 10px; background: #00000006; border-radius: 10px; margin-bottom: 10px; min-height: 28px; word-break: break-all; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.calc-grid button {
  padding: 12px 0; border-radius: 10px; border: none; background: #00000008; font-size: 1rem; cursor: pointer;
}
.calc-grid button.op { background: var(--ink); color: white; }
.calc-grid button:hover { filter: brightness(0.95); }
.calc-hist { margin-top: 12px; font-size: 0.75rem; opacity: 0.5; max-height: 90px; overflow-y: auto; }

/* ---------- Estudos extras page ---------- */
.study-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.study-card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.study-card .top { display: flex; justify-content: space-between; align-items: center; }
.study-card input.title {
  font-size: 1.05rem; font-weight: 800; border: none; background: transparent; flex: 1; padding: 2px 0;
}
.study-card textarea { min-height: 100px; }
.add-study-card {
  border: 2px dashed var(--line); border-radius: 14px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; min-height: 100px; opacity: 0.5; font-weight: 700; background: none;
}
.add-study-card:hover { opacity: 0.9; }

footer.foot { text-align: center; font-size: 11px; opacity: 0.35; padding: 30px 20px; }

</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="brand"></div>
    <nav class="mainnav" id="mainnav"></nav>
    <div id="authBox"></div>
    <div class="lang-switch" id="langSwitch"></div>
  </div>
</div>

<main>
  <div class="eyebrow" id="txtEyebrowSemana">Caderno de rotina</div>
  <h1 id="txtTituloSemana">Minha semana</h1>

  <div class="weeknav">
    <button id="prevWeek" aria-label="Semana anterior">←</button>
    <div class="weekrange" id="weekRange"></div>
    <button id="nextWeek" aria-label="Próxima semana">→</button>
    <button class="today-link" id="todayBtn">hoje</button>
    <span style="font-size:11px;opacity:.4" id="saveHint"></span>
  </div>

  <div class="eyebrow" style="margin-top:6px" id="txtEyebrowDisc">Minhas disciplinas · arraste para um dia</div>
  <div class="disc-bar" id="discBar"></div>

  <div class="grid" id="weekGrid"></div>
</main>

<footer class="foot" id="txtFooter">Seus dados ficam salvos automaticamente neste navegador.</footer>

<script>
// ---------- Configuração ----------
const SITE_NAME = "tape"; // nome do site

const DAY_DEFS = [
  { key: "seg", label: "Segunda", css: "--seg" },
  { key: "ter", label: "Terça", css: "--ter" },
  { key: "qua", label: "Quarta", css: "--qua" },
  { key: "qui", label: "Quinta", css: "--qui" },
  { key: "sex", label: "Sexta", css: "--sex" },
  { key: "sab", label: "Sábado", css: "--sab" },
  { key: "dom", label: "Domingo", css: "--dom" },
];

const DISC_COLORS = ["#FF6B6B", "#FF9F43", "#F4C430", "#4CAF7D", "#4D96FF", "#A78BFA", "#FF6FB5", "#2BB4B4"];

// ---------- localStorage helpers ----------
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}
function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    return false;
  }
}

// ---------- Datas ----------
function startOfWeekMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function isoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const da = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${da}`;
}
function fmtShort(d) {
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit" });
}
function uid() {
  return Math.random().toString(36).slice(2, 10);
}

// ---------- Disciplinas (compartilhado entre páginas) ----------
function getDisciplinas() {
  return loadJSON("disciplinas", []);
}
function saveDisciplinas(list) {
  saveJSON("disciplinas", list);
}

let currentLang = localStorage.getItem("idioma") || "pt";
function t(key) {
  return (I18N[currentLang] && I18N[currentLang][key]) || I18N.pt[key] || key;
}
function setLang(lang) {
  localStorage.setItem("idioma", lang);
  location.reload();
}
function renderLangSwitch() {
  const el = document.getElementById("langSwitch");
  if (!el) return;
  const langs = [["pt","Português"],["en","English"],["es","Español"]];
  el.innerHTML = `
    <div class="lang-dropdown">
      <button class="lang-toggle" id="langToggleBtn" aria-haspopup="true" aria-expanded="false">🌐 ${currentLang.toUpperCase()} <span class="caret">▾</span></button>
      <div class="lang-menu" id="langMenu">
        ${langs.map(([code, name]) => `<button data-lang="${code}" class="${code === currentLang ? "active" : ""}">${name}</button>`).join("")}
      </div>
    </div>`;
  const toggleBtn = document.getElementById("langToggleBtn");
  const menu = document.getElementById("langMenu");
  toggleBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    menu.classList.toggle("open");
  });
  menu.querySelectorAll("button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
  document.addEventListener("click", () => menu.classList.remove("open"));
}

// ---------- Navbar ----------
function renderNav(activePage) {
  const CALC_LABEL = { pt: "Calculadora", en: "Calculator", es: "Calculadora" };
  const links = [
    { href: "index.html", key: "nav_semana" },
    { href: "disciplinas.html", key: "nav_disciplinas" },
    { href: "anotacoes.html", key: "nav_anotacoes" },
    { href: "estudos.html", key: "nav_estudos" },
    { href: "calculadora.html", key: "nav_calculadora" },
    { href: "ajuda.html", key: "nav_ajuda" },
    { href: "sugestoes.html", key: "nav_sugestoes" },
    { href: "creditos.html", key: "nav_creditos" },
  ];
  const nav = document.getElementById("mainnav");
  if (!nav) return;
  nav.innerHTML = links
    .map(
      (l) =>
        `<a href="${l.href}" class="${l.href === activePage ? "active" : ""}">${l.key === "nav_calculadora" ? (CALC_LABEL[currentLang] || CALC_LABEL.pt) : t(l.key)}</a>`
    )
    .join("");
  const brand = document.getElementById("brand");
  if (brand) brand.innerHTML = `<svg width="30" height="30" viewBox="0 0 200 200" style="flex-shrink:0">  <rect width="200" height="200" rx="40" fill="#F1E6CF"/>  <circle cx="100" cy="46" r="7" fill="#8C3B2E"/>  <polyline points="38,146 100,92 162,146" fill="none" stroke="#B65C38" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>  <polyline points="55,119 100,77 145,119" fill="none" stroke="#D89B4A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>  <polyline points="72,92 100,64 128,92" fill="none" stroke="#56705A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand-text">${SITE_NAME}</span><span>· ${t("tagline")}</span>`;
  document.title = SITE_NAME;
  renderLangSwitch();
}

</script>
<script>
renderNav("index.html");
document.getElementById("txtEyebrowSemana").textContent = t("eyebrow_semana");
document.getElementById("txtTituloSemana").textContent = t("titulo_semana");
document.getElementById("prevWeek").setAttribute("aria-label", t("aria_semana_anterior"));
document.getElementById("nextWeek").setAttribute("aria-label", t("aria_proxima_semana"));
document.getElementById("todayBtn").textContent = t("hoje");
document.getElementById("txtEyebrowDisc").textContent = t("eyebrow_disc_bar");
document.getElementById("txtFooter").textContent = t("footer_rodape");

let monday = startOfWeekMonday(new Date());
let weekData = emptyWeekData();
let dragDiscId = null;
let dragItem = null; // { fromDay, itemId }
let openAddDay = null;

function emptyWeekData() {
  const schedule = {}, aprendizado = {}, resumo = {}, tarefas = {};
  DAY_DEFS.forEach(d => { schedule[d.key] = []; aprendizado[d.key] = ""; resumo[d.key] = ""; tarefas[d.key] = []; });
  return { schedule, aprendizado, resumo, tarefas };
}

function weekKey(m) { return `semana:${isoDate(m)}`; }

function loadWeek() {
  const base = emptyWeekData();
  const stored = loadJSON(weekKey(monday), null);
  if (stored) {
    weekData = {
      schedule: { ...base.schedule, ...stored.schedule },
      aprendizado: { ...base.aprendizado, ...stored.aprendizado },
      resumo: { ...base.resumo, ...stored.resumo },
      tarefas: { ...base.tarefas, ...stored.tarefas },
    };
  } else {
    weekData = base;
  }
}

let saveTimer = null;
function persistWeek() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const ok = saveJSON(weekKey(monday), weekData);
    const hint = document.getElementById("saveHint");
    hint.textContent = ok ? t("salvo") : t("erro_salvar");
    setTimeout(() => (hint.textContent = ""), 900);
  }, 400);
}

function discById(id) {
  return getDisciplinas().find(d => d.id === id);
}

function renderWeekRange() {
  const sunday = addDays(monday, 6);
  document.getElementById("weekRange").textContent = `${fmtShort(monday)} – ${fmtShort(sunday)}`;
}

function renderDiscBar() {
  const bar = document.getElementById("discBar");
  const list = getDisciplinas();
  bar.innerHTML = "";
  list.forEach(d => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.style.background = d.color + "22";
    chip.style.color = d.color;
    chip.style.border = `1px solid ${d.color}55`;
    chip.draggable = true;
    chip.textContent = d.name;
    chip.title = t("clique_para_escolher_dia");
    chip.addEventListener("dragstart", () => { dragDiscId = d.id; dragItem = null; });
    chip.addEventListener("click", (e) => {
      e.stopPropagation();
      const existing = chip.querySelector(".day-popover");
      document.querySelectorAll(".day-popover").forEach((p) => p.remove());
      if (existing) return; // clique de novo no mesmo chip só fecha
      const pop = document.createElement("div");
      pop.className = "day-popover";
      DAY_DEFS.forEach((day) => {
        const dayBtn = document.createElement("button");
        dayBtn.textContent = t("day_" + day.key);
        dayBtn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          weekData.schedule[day.key].push({ id: uid(), disciplinaId: d.id, hora: "" });
          persistWeek();
          renderGrid();
          pop.remove();
        });
        pop.appendChild(dayBtn);
      });
      chip.appendChild(pop);
    });
    bar.appendChild(chip);
  });
  if (list.length === 0) {
    const hint = document.createElement("span");
    hint.style.fontSize = "0.82rem";
    hint.style.opacity = "0.5";
    hint.innerHTML = `${t("disc_vazia_texto")} <a href="disciplinas.html" style="text-decoration:underline">${t("nav_disciplinas")}</a>.`;
    bar.appendChild(hint);
  }
}

function renderGrid() {
  const grid = document.getElementById("weekGrid");
  grid.innerHTML = "";
  const disciplinas = getDisciplinas();

  DAY_DEFS.forEach((day, di) => {
    const dayDate = addDays(monday, di);
    const card = document.createElement("div");
    card.className = "day-card";

    card.addEventListener("dragover", e => e.preventDefault());
    card.addEventListener("drop", () => {
      if (dragDiscId) { weekData.schedule[day.key].push({ id: uid(), disciplinaId: dragDiscId, hora: "" }); persistWeek(); renderGrid(); }
      if (dragItem) {
        const { fromDay, itemId } = dragItem;
        if (fromDay !== day.key) {
          const idx = weekData.schedule[fromDay].findIndex(i => i.id === itemId);
          if (idx > -1) {
            const [it] = weekData.schedule[fromDay].splice(idx, 1);
            weekData.schedule[day.key].push(it);
            persistWeek(); renderGrid();
          }
        }
      }
      dragDiscId = null; dragItem = null;
    });

    // head
    const head = document.createElement("div");
    head.className = "day-head";
    head.style.background = `var(${day.css})`;
    head.innerHTML = `<div><div class="date">${fmtShort(dayDate)}</div><div class="name">${t("day_" + day.key)}</div></div>`;
    const addBtn = document.createElement("button");
    addBtn.textContent = "+";
    addBtn.addEventListener("click", () => { openAddDay = openAddDay === day.key ? null : day.key; renderGrid(); });
    head.appendChild(addBtn);
    card.appendChild(head);

    if (openAddDay === day.key) {
      const addList = document.createElement("div");
      addList.className = "day-addlist";
      addList.style.background = `var(${day.css})22`;
      if (disciplinas.length === 0) {
        addList.innerHTML = `<span style="font-size:.75rem;opacity:.5">${t("cadastre_primeiro")}</span>`;
      }
      disciplinas.forEach(d => {
        const b = document.createElement("button");
        b.textContent = d.name;
        b.style.color = d.color;
        b.style.borderColor = d.color + "55";
        b.addEventListener("click", () => {
          weekData.schedule[day.key].push({ id: uid(), disciplinaId: d.id, hora: "" });
          openAddDay = null;
          persistWeek(); renderGrid();
        });
        addList.appendChild(b);
      });
      card.appendChild(addList);
    }

    // schedule
    const sched = document.createElement("div");
    sched.className = "day-schedule";
    const items = weekData.schedule[day.key];
    if (items.length === 0) {
      const e = document.createElement("div");
      e.className = "sched-empty";
      e.textContent = t("nenhuma_aula");
      sched.appendChild(e);
    }
    items.forEach(it => {
      const disc = discById(it.disciplinaId);
      if (!disc) return;
      const row = document.createElement("div");
      row.className = "sched-item";
      row.draggable = true;
      row.addEventListener("dragstart", () => { dragItem = { fromDay: day.key, itemId: it.id }; dragDiscId = null; });
      row.innerHTML = `<span class="dot" style="background:${disc.color}"></span><span class="nm" style="color:${disc.color}">${disc.name}</span>`;
      const horaInput = document.createElement("input");
      horaInput.placeholder = t("hora_placeholder");
      horaInput.value = it.hora;
      horaInput.addEventListener("input", e => { it.hora = e.target.value; persistWeek(); });
      row.appendChild(horaInput);
      const rm = document.createElement("button");
      rm.className = "rm"; rm.textContent = "×";
      rm.addEventListener("click", () => {
        weekData.schedule[day.key] = weekData.schedule[day.key].filter(x => x.id !== it.id);
        persistWeek(); renderGrid();
      });
      row.appendChild(rm);
      sched.appendChild(row);
    });
    card.appendChild(sched);

    // body: aprendizado, resumo, tarefas
    const body = document.createElement("div");
    body.className = "day-body";

    body.appendChild(makeField(t("aprendi_label"), weekData.aprendizado[day.key], v => { weekData.aprendizado[day.key] = v; persistWeek(); }));
    body.appendChild(makeField(t("resumo_label"), weekData.resumo[day.key], v => { weekData.resumo[day.key] = v; persistWeek(); }));

    const taskWrap = document.createElement("div");
    const taskLabel = document.createElement("div");
    taskLabel.className = "field-label";
    taskLabel.textContent = t("tarefas_label");
    taskWrap.appendChild(taskLabel);

    weekData.tarefas[day.key].forEach(task => {
      const row = document.createElement("label");
      row.className = "task-row";
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = task.done;
      cb.addEventListener("change", () => { task.done = !task.done; persistWeek(); renderGrid(); });
      row.appendChild(cb);
      const span = document.createElement("span");
      span.textContent = task.text;
      if (task.done) span.className = "done";
      row.appendChild(span);
      const rm = document.createElement("button");
      rm.className = "rm"; rm.textContent = "×";
      rm.addEventListener("click", (e) => {
        e.preventDefault();
        weekData.tarefas[day.key] = weekData.tarefas[day.key].filter(x => x.id !== task.id);
        persistWeek(); renderGrid();
      });
      row.appendChild(rm);
      taskWrap.appendChild(row);
    });

    const addRow = document.createElement("div");
    addRow.className = "task-add";
    const input = document.createElement("input");
    input.placeholder = t("tarefa_placeholder");
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && input.value.trim()) {
        weekData.tarefas[day.key].push({ id: uid(), text: input.value.trim(), done: false });
        input.value = "";
        persistWeek(); renderGrid();
      }
    });
    addRow.appendChild(input);
    taskWrap.appendChild(addRow);
    body.appendChild(taskWrap);

    card.appendChild(body);
    grid.appendChild(card);
  });
}

function makeField(label, value, onChange) {
  const wrap = document.createElement("div");
  const l = document.createElement("div");
  l.className = "field-label"; l.textContent = label;
  wrap.appendChild(l);
  const ta = document.createElement("textarea");
  ta.rows = 2; ta.value = value; ta.placeholder = t("anote_placeholder");
  ta.addEventListener("input", e => onChange(e.target.value));
  wrap.appendChild(ta);
  return wrap;
}

function refreshAll() {
  renderWeekRange();
  renderDiscBar();
  loadWeek();
  renderGrid();
}

document.getElementById("prevWeek").addEventListener("click", () => { monday = addDays(monday, -7); refreshAll(); });
document.getElementById("nextWeek").addEventListener("click", () => { monday = addDays(monday, 7); refreshAll(); });
document.getElementById("todayBtn").addEventListener("click", () => { monday = startOfWeekMonday(new Date()); refreshAll(); });

document.addEventListener("click", () => {
  document.querySelectorAll(".day-popover").forEach((p) => p.remove());
});

refreshAll();
</script>
</body>
</html>
