<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Semana</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
html { font-size: 100%; }
:root {
  color-scheme: only light;
  --paper: #FBF3E6;
  --ink: #1A1712;
  --line: #00000014;
  --card: #FFFCF5;
  --overlay: #00000008;
  --overlay-2: #00000010;
  --seg: #C1502B;
  --ter: #D9A441;
  --qua: #C1922B;
  --qui: #5B7A4F;
  --sex: #3E7C8A;
  --sab: #7A4B5E;
  --dom: #C97B63;
}
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

a { color: inherit; text-decoration: none; }

/* ---------- Navbar ---------- */
.topbar {
  border-bottom: 1px solid var(--line);
  background: var(--paper);
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.brand {
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-text-group { display: flex; flex-direction: column; gap: 2px; line-height: 1.1; }
.brand span.brand-text {
  opacity: 1; font-weight: 800; font-size: 1.05em; letter-spacing: 0.03em; text-transform: capitalize;
  color: var(--ink);
}
@supports (background-clip: text) or (-webkit-background-clip: text) {
  .brand span.brand-text {
    background: linear-gradient(120deg, #B5502E, #D9A441 55%, #C97B63);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  }
}
.brand span.brand-tagline { opacity: 0.55; font-weight: 600; font-size: 0.62em; letter-spacing: 0.02em; }
nav.mainnav { display: flex; gap: 4px; flex-wrap: wrap; }
nav.mainnav a {
  font-size: 0.85rem;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 999px;
  opacity: 0.55;
  transition: all .15s ease;
}
nav.mainnav a:hover { opacity: 0.85; background: #00000008; }
nav.mainnav a.active { opacity: 1; background: var(--ink); color: var(--paper); }

.lang-dropdown { position: relative; }
.lang-toggle {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.78rem; font-weight: 700; padding: 7px 13px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14); cursor: pointer; color: var(--ink);
}
.lang-toggle:hover { background: #00000008; }
.lang-toggle .caret { font-size: 9px; opacity: 0.5; }
.lang-menu {
  position: absolute; top: calc(100% + 8px); right: 0;
  background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden;
  min-width: 150px; display: none; z-index: 30;
}
.lang-menu.open { display: block; }
.lang-menu button {
  width: 100%; text-align: left; padding: 10px 14px; border: none; background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14);
  font-size: 0.85rem; cursor: pointer; display: block; color: var(--ink);
}
.lang-menu button:hover { background: #00000008; }
.lang-menu button.active { font-weight: 800; background: #00000006; }

/* ---------- Zoom controls ---------- */
.zoom-wrap { display: flex; justify-content: center; margin: 4px 0 10px; }
.zoom-controls {
  display: flex; align-items: center; gap: 2px; padding: 3px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14);
}
.zoom-btn {
  width: 22px; height: 22px; border-radius: 999px; border: none; cursor: pointer;
  font-weight: 700; font-size: 0.78rem; color: var(--ink); display: flex; align-items: center; justify-content: center;
  background: transparent; opacity: 0.6; transition: background .12s ease, opacity .12s ease;
}
.zoom-btn:hover { background: #00000008; opacity: 1; }
.zoom-reset {
  font-size: 0.62rem; font-weight: 700; opacity: 0.4; padding: 0 6px; cursor: pointer;
  border: none; background: none; color: var(--ink); min-width: 28px;
}
.zoom-reset:hover { opacity: 0.75; }

main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
@media (max-width: 480px) {
  main { padding: 18px 12px 50px; }
  h1 { font-size: 1.5rem; }
  .topbar-inner { padding: 12px 14px; }
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0.65;
  margin-bottom: 4px;
}
h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; }
h1::after { content: ""; display: block; width: 46px; height: 4px; border-radius: 999px; margin-top: 10px; background: linear-gradient(120deg, #B5502E, #D9A441 55%, #C97B63); }

/* ---------- Week nav ---------- */
.weeknav {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 18px 0 20px;
}
.weeknav button {
  width: 34px; height: 34px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14);
  cursor: pointer;
  font-size: 1rem;
}
.weeknav button:hover { background: #00000008; }
.weekrange { font-size: 0.9rem; font-weight: 600; padding: 6px 14px; border-radius: 999px; background: #00000008; }
.today-link { font-size: 0.8rem; opacity: 0.55; text-decoration: underline; cursor: pointer; background: none; border: none; }

/* ---------- Disciplinas chips ---------- */
.disc-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 26px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 6px 6px 12px;
  border-radius: 999px;
  font-size: 0.85rem; font-weight: 600;
  cursor: grab;
  user-select: none;
  transition: transform .12s ease, box-shadow .12s ease;
}
.chip:hover { transform: translateY(-2px); box-shadow: 0 6px 14px -7px currentColor; }
.chip:active { cursor: grabbing; }
.chip button {
  border: none; width: 16px; height: 16px; border-radius: 999px;
  font-size: 11px; cursor: pointer; opacity: 0.5;
}
.chip button:hover { opacity: 1; }
.chip { position: relative; }
.day-popover {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 25;
  background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 6px; min-width: 130px;
  display: flex; flex-direction: column; gap: 2px;
}
.day-popover button {
  border: none; background: none; text-align: left; padding: 7px 10px; border-radius: 8px;
  font-size: 0.82rem; cursor: pointer; color: var(--ink); opacity: 0.85;
}
.day-popover button:hover { background: #00000008; opacity: 1; }
.add-disc { display: inline-flex; gap: 6px; }
.add-disc input {
  font-size: 0.85rem; padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--line); width: 150px;
}
.add-disc button {
  width: 32px; height: 32px; border-radius: 999px; border: none;
  background: var(--ink); color: var(--paper); cursor: pointer; font-size: 1rem;
}

/* ---------- Day track (navegação horizontal) ---------- */
.day-track {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px;
  -webkit-overflow-scrolling: touch; scrollbar-width: thin;
}
.day-pill {
  flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 9px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14);
  cursor: pointer; opacity: 0.55; transition: all .15s ease; font-family: inherit;
}
.day-pill:hover { opacity: 0.85; }
.day-pill .pill-name { font-size: 0.82rem; font-weight: 800; }
.day-pill .pill-date { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; }
.day-pill.today { box-shadow: 0 0 0 2px var(--pill-color, var(--ink)) inset; }
.day-pill.active {
  opacity: 1; color: white; background: var(--pill-color, var(--ink)); border-color: transparent;
  transform: translateY(-2px); box-shadow: 0 8px 18px -8px var(--pill-color, rgba(0,0,0,.4));
}

/* ---------- Day card (dia ativo) ---------- */
.day-card { background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .15s ease; }
.day-card.drag-over { box-shadow: 0 0 0 3px var(--drop-color, #00000033) inset; }
.day-card.minimized .day-schedule, .day-card.minimized .day-body, .day-card.minimized .day-addlist { display: none; }
.day-head {
  padding: 16px 18px; color: white; display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.day-head .head-btns { display: flex; align-items: center; gap: 6px; }
.day-head .date { font-size: 10.5px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.85; }
.day-head .name { font-size: 1.3rem; font-weight: 800; }
.day-head button {
  width: 32px; height: 32px; border-radius: 999px; border: none;
  background: rgba(255,255,255,0.25); color: white; cursor: pointer; font-weight: 700; font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.day-head .min-btn { font-size: 0.9rem; }
.day-addlist { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; }
.day-addlist button { font-size: 0.75rem; padding: 5px 10px; border-radius: 999px; border: 1px solid; background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14); cursor: pointer; }

.day-schedule { padding: 12px 16px 6px; display: flex; flex-direction: column; gap: 6px; min-height: 30px; }
.sched-empty { font-size: 0.8rem; opacity: 0.4; padding: 4px 0; }
.sched-item {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px;
  cursor: grab; transition: box-shadow .12s ease, transform .12s ease;
}
.sched-item.drag-over-item { box-shadow: 0 0 0 2px var(--ink) inset; transform: scale(1.015); }
.sched-item .dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
.sched-item .nm { font-size: 0.88rem; font-weight: 700; cursor: pointer; }
.sched-item .nm:hover { text-decoration: underline; }
.sched-item .topic-badge {
  font-size: 0.72rem; opacity: 0.55; cursor: pointer; padding: 2px 8px; border-radius: 999px;
  background: #00000008; margin-right: auto;
}
.sched-item .topic-badge:hover { opacity: 0.9; background: #0000000f; }
.sched-item input { width: 52px; font-size: 0.75rem; text-align: right; border: none; background: transparent; opacity: 0.7; }
.sched-item .rm { border: none; background: none; opacity: 0.3; cursor: pointer; font-size: 0.8rem; }
.sched-item .rm:hover { opacity: 0.8; }

.day-body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); }
.field-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.6; margin-bottom: 5px; }
textarea, .textinput {
  width: 100%; border: none; background: #00000006; border-radius: 10px;
  padding: 8px 10px; font-size: 0.85rem; font-family: inherit; resize: vertical;
}
textarea:focus, .textinput:focus { outline: 2px solid #00000022; }

/* botão que abre o campo de resumo/aprendizado só quando clicado */
.field-toggle {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: none; background: #00000006; border-radius: 10px; padding: 9px 12px;
  font-family: inherit; cursor: pointer; transition: background .12s ease;
}
.field-toggle:hover { background: #0000000f; }
.field-toggle .ft-plus {
  width: 20px; height: 20px; border-radius: 999px; background: var(--ink); color: var(--paper);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700;
}
.field-toggle.filled .ft-plus { background: #00000022; }
.field-toggle .ft-text { flex: 1; min-width: 0; }
.field-toggle .ft-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.5; }
.field-toggle .ft-preview { font-size: 0.82rem; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Modal ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(20,18,14,0.5); backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 18px;
}
.modal-box {
  background: var(--paper); border-radius: 20px; max-width: 640px; width: 100%; max-height: 88vh;
  overflow-y: auto; padding: 22px 24px 20px; box-shadow: 0 30px 70px -20px rgba(0,0,0,0.45);
}
.modal-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.modal-box h3 { margin: 0; font-size: 1.15rem; letter-spacing: -0.01em; }
.modal-box .modal-sub { font-size: 0.78rem; opacity: 0.55; margin-top: 2px; }
.modal-close { flex-shrink: 0; border: none; background: #00000010; width: 32px; height: 32px; border-radius: 999px; cursor: pointer; font-size: 1rem; }
.modal-close:hover { background: #0000001a; }
.modal-box input.topic-input {
  width: 100%; border: none; background: #00000008; border-radius: 10px; padding: 9px 12px;
  font-size: 0.95rem; font-weight: 700; font-family: inherit; margin-bottom: 10px;
}
.modal-box textarea { min-height: 220px; font-size: 0.95rem; line-height: 1.6; }
.modal-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.modal-tabbtn { border: none; background: #00000008; padding: 6px 13px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; opacity: 0.6; cursor: pointer; }
.modal-tabbtn.active { opacity: 1; background: var(--ink); color: var(--paper); }
.katex-preview { background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-height: 220px; font-size: 0.95rem; line-height: 1.6; }
.modal-hint { font-size: 0.72rem; opacity: 0.45; margin-top: 8px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.modal-actions button { padding: 9px 18px; border-radius: 999px; border: none; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
.modal-actions .btn-save { background: var(--ink); color: var(--paper); }
.modal-actions .btn-save:hover { filter: brightness(1.15); }
.modal-actions .btn-cancel { background: #00000010; color: var(--ink); }
.modal-actions .btn-cancel:hover { background: #0000001a; }

.task-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
.task-row span.done { opacity: 0.4; text-decoration: line-through; }
.task-row .task-when { font-size: 0.68rem; opacity: 0.5; background: #00000008; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.task-row .rm { margin-left: auto; border: none; background: none; opacity: 0; cursor: pointer; }
.task-row:hover .rm { opacity: 0.4; }
.task-row .rm:hover { opacity: 1; }
.task-add-btn {
  display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; opacity: 0.6;
  border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 6px 12px; cursor: pointer;
  margin-top: 2px; width: fit-content;
}
.task-add-btn:hover { opacity: 1; background: #00000006; }
.task-add-form { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; }
.task-add-form input[type="text"] { flex: 1; min-width: 100px; font-size: 0.85rem; border: none; background: #00000006; border-radius: 8px; padding: 6px 10px; }
.task-add-form input[type="date"], .task-add-form input[type="time"] {
  font-size: 0.75rem; border: none; background: #00000006; border-radius: 8px; padding: 6px 8px; color: var(--ink);
}
.task-add-form button { font-size: 0.78rem; font-weight: 700; border: none; border-radius: 8px; padding: 6px 12px; background: var(--ink); color: var(--paper); cursor: pointer; }

/* ---------- Múltiplos cards por dia ---------- */
.day-cards-row { display: flex; flex-direction: column; gap: 10px; }
.day-card-tab-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 2px; }
.day-card-tab {
  font-size: 0.72rem; font-weight: 700; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14); cursor: pointer; opacity: 0.55;
}
.day-card-tab.active { opacity: 1; color: white; border-color: transparent; }
.day-card-tab-add {
  font-size: 0.85rem; font-weight: 800; width: 26px; height: 26px; border-radius: 999px; border: 1px dashed var(--line);
  background: none; cursor: pointer; opacity: 0.5; line-height: 1;
}
.day-card-tab-add:hover { opacity: 1; }

/* ---------- Disciplinas page ---------- */
.disc-card { background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.disc-card .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.disc-card input.small { flex: 1; min-width: 140px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 0.9rem; }
.disc-card textarea { min-height: 60px; }
.disc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.disc-name { font-weight: 800; font-size: 1.05rem; }
.del-btn { border: none; background: none; color: #B33; cursor: pointer; font-size: 0.8rem; opacity: 0.6; }
.del-btn:hover { opacity: 1; }
.new-disc-btn {
  padding: 10px 18px; border-radius: 999px; border: none; background: var(--ink); color: var(--paper);
  font-size: 0.85rem; font-weight: 700; cursor: pointer;
}

/* ---------- Anotacoes page ---------- */
.notes-wrap { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
@media (max-width: 800px) { .notes-wrap { grid-template-columns: 1fr; } }
.notes-wrap textarea { min-height: 460px; font-size: 0.95rem; line-height: 1.5; }
.calc-box { background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14); border: 1px solid var(--line); border-radius: 14px; padding: 16px; height: fit-content; }
.calc-display { font-size: 1.4rem; text-align: right; padding: 10px; background: #00000006; border-radius: 10px; margin-bottom: 10px; min-height: 28px; word-break: break-all; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.calc-grid button {
  padding: 12px 0; border-radius: 10px; border: none; background: #00000008; font-size: 1rem; cursor: pointer;
}
.calc-grid button.op { background: var(--ink); color: var(--paper); }
.calc-grid button:hover { filter: brightness(0.95); }
.calc-hist { margin-top: 12px; font-size: 0.75rem; opacity: 0.5; max-height: 90px; overflow-y: auto; }

/* ---------- Estudos extras page ---------- */
.study-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.study-card { background: var(--card); box-shadow: 0 2px 12px -6px rgba(30,25,18,0.14); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.study-card .top { display: flex; justify-content: space-between; align-items: center; }
.study-card input.title {
  font-size: 1.05rem; font-weight: 800; border: none; background: transparent; flex: 1; padding: 2px 0;
}
.study-card textarea { min-height: 100px; }
.add-study-card {
  border: 2px dashed var(--line); border-radius: 14px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; min-height: 100px; opacity: 0.5; font-weight: 700; background: none;
}
.add-study-card:hover { opacity: 0.9; }

footer.foot { text-align: center; font-size: 11px; opacity: 0.35; padding: 30px 20px; }

</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="brand"></div>
    <nav class="mainnav" id="mainnav"></nav>
    <div id="authBox">
  <button id="btnSair" style="background-color: #dc3545; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">Sair</button>
</div>
    <div class="lang-switch" id="langSwitch"></div>
  </div>
</div>

<main>
  <div class="eyebrow" id="txtEyebrowSemana">Caderno de rotina</div>
  <h1 id="txtTituloSemana">Minha semana</h1>

  <div class="weeknav">
    <button id="prevWeek" aria-label="Semana anterior">←</button>
    <div class="weekrange" id="weekRange"></div>
    <button id="nextWeek" aria-label="Próxima semana">→</button>

  try {

function saveJSON(key, value) {
  try {

}

  return date;
}
function addDays(d, n) {

function renderLangSwitch() {
  const el = document.getElementById("langSwitch");

  const langs = [["pt","Português"],["en","English"],["es","Español"]];
  el.innerHTML = `
    <div class="lang-dropdown">
      <button class="lang-toggle" id="langToggleBtn" aria-haspopup="true" aria-expanded="false">🌐 ${currentLang.toUpperCase()} <span class="caret">▾</span></button>
      <div class="lang-menu" id="langMenu">
        ${langs.map(([code, name]) => `<button data-lang="${code}" class="${code === currentLang ? "active" : ""}">${name}</button>`).join("")}
      </div>
    </div>`;
  const toggleBtn = document.getElementById("langToggleBtn");
  const menu = document.getElementById("langMenu");
  toggleBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    menu.classList.toggle("open");
  });
  menu.querySelectorAll("button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
  document.addEventListener("click", () => menu.classList.remove("open"));
}

  if (brand) brand.innerHTML = `<svg width="30" height="30" viewBox="0 0 200 200" style="flex-shrink:0">  <rect width="200" height="200" rx="40" fill="#F1E6CF"/>  <circle cx="100" cy="46" r="7" fill="#8C3B2E"/>  <polyline points="38,146 100,92 162,146" fill="none" stroke="#B65C38" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>  <polyline points="55,119 100,77 145,119" fill="none" stroke="#D89B4A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>  <polyline points="72,92 100,64 128,92" fill="none" stroke="#56705A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand-text-group"><span class="brand-text">${SITE_NAME}</span><span class="brand-tagline">${t("tagline")}</span></span>`;
  document.title = SITE_NAME;
  renderLangSwitch();
}

</script>
<script>
renderNav("index.html");
document.getElementById("txtEyebrowSemana").textContent = t("eyebrow_semana");
document.getElementById("txtTituloSemana").textContent = t("titulo_semana");
document.getElementById("prevWeek").setAttribute("aria-label", t("aria_semana_anterior"));
document.getElementById("nextWeek").setAttribute("aria-label", t("aria_proxima_semana"));
document.getElementById("todayBtn").textContent = t("hoje");
document.getElementById("txtEyebrowDisc").textContent = t("eyebrow_disc_bar");
document.getElementById("txtFooter").textContent = t("footer_rodape");

let monday = startOfWeekMonday(new Date());
let weekData = emptyWeekData();
let dragDiscId = null;
let dragDiscColor = null;
let dragItem = null; // { fromDay, itemId }
let openAddDay = null;
let activeSubCard = {};
let minimizedDays = new Set();
let openTaskForm = null;

function todayKey() {
  const idx = (new Date().getDay() + 6) % 7; // 0 = segunda ... 6 = domingo
  return DAY_DEFS[idx].key;
}
let activeDayKey = todayKey();

// ---------- Zoom de texto ----------
const ZOOM_KEY = "zoom_scale";
let zoomScale = parseInt(localStorage.getItem(ZOOM_KEY) || "100", 10);
if (isNaN(zoomScale)) zoomScale = 100;
function applyZoom() {
  document.documentElement.style.fontSize = zoomScale + "%";
  const label = document.getElementById("zoomReset");
  if (label) label.textContent = zoomScale + "%";
}
function setupZoomControls() {
  document.getElementById("zoomOut").addEventListener("click", () => {
    zoomScale = Math.max(80, zoomScale - 10);
    localStorage.setItem(ZOOM_KEY, zoomScale);
    applyZoom();
  });
  document.getElementById("zoomIn").addEventListener("click", () => {
    zoomScale = Math.min(160, zoomScale + 10);
    localStorage.setItem(ZOOM_KEY, zoomScale);
    applyZoom();
  });
  document.getElementById("zoomReset").addEventListener("click", () => {
    zoomScale = 100;
    localStorage.setItem(ZOOM_KEY, zoomScale);
    applyZoom();
  });
  applyZoom();
}
setupZoomControls();

// ---------- Modal genérico (anotações com suporte a KaTeX) ----------
function renderKatexPreview(el, text) {
  el.textContent = text || "";
  if (window.renderMathInElement) {
    try {
      renderMathInElement(el, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false },
        ],
        throwOnError: false,
      });
    } catch (e) { /* ignore */ }
  }
}

function openNoteModal({ title, subtitle, showTopic, topicValue, topicPlaceholder, value, onSave }) {
  const root = document.getElementById("modalRoot");
  root.innerHTML = "";
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });

  const box = document.createElement("div");
  box.className = "modal-box";

  const top = document.createElement("div");
  top.className = "modal-top";
  top.innerHTML = `<div><h3>${title}</h3>${subtitle ? `<div class="modal-sub">${subtitle}</div>` : ""}</div>`;
  const closeBtn = document.createElement("button");
  closeBtn.className = "modal-close"; closeBtn.textContent = "×";
  closeBtn.addEventListener("click", close);
  top.appendChild(closeBtn);
  box.appendChild(top);

  let topicInput = null;
  if (showTopic) {
    topicInput = document.createElement("input");
    topicInput.className = "topic-input";
    topicInput.placeholder = topicPlaceholder || "Título do tópico (ex: Mapa de Veitch-Karnaugh)";
    topicInput.value = topicValue || "";
    box.appendChild(topicInput);
  }

  const tabs = document.createElement("div");
  tabs.className = "modal-tabs";
  const tabEdit = document.createElement("button");
  tabEdit.className = "modal-tabbtn active"; tabEdit.textContent = "Escrever";
  const tabPreview = document.createElement("button");
  tabPreview.className = "modal-tabbtn"; tabPreview.textContent = "Pré-visualizar (KaTeX)";
  tabs.appendChild(tabEdit); tabs.appendChild(tabPreview);
  box.appendChild(tabs);

  const ta = document.createElement("textarea");
  ta.className = "textinput";
  ta.value = value || "";
  ta.placeholder = t("anote_placeholder") + " use $x^2$ ou $$\\frac{a}{b}$$ para fórmulas";
  box.appendChild(ta);

  const preview = document.createElement("div");
  preview.className = "katex-preview";
  preview.style.display = "none";
  box.appendChild(preview);

  tabEdit.addEventListener("click", () => {
    tabEdit.classList.add("active"); tabPreview.classList.remove("active");
    ta.style.display = ""; preview.style.display = "none";
  });
  tabPreview.addEventListener("click", () => {
    tabPreview.classList.add("active"); tabEdit.classList.remove("active");
    ta.style.display = "none"; preview.style.display = "block";
    renderKatexPreview(preview, ta.value);
  });

  const hint = document.createElement("div");
  hint.className = "modal-hint";
  hint.textContent = "Dica: use $ ... $ para fórmulas em linha e $$ ... $$ para fórmulas em destaque.";
  box.appendChild(hint);

  const actions = document.createElement("div");
  actions.className = "modal-actions";
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "btn-cancel"; cancelBtn.textContent = "Cancelar";
  cancelBtn.addEventListener("click", close);
  const saveBtn = document.createElement("button");
  saveBtn.className = "btn-save"; saveBtn.textContent = "Salvar";
  saveBtn.addEventListener("click", () => {
    onSave({ value: ta.value, topic: topicInput ? topicInput.value : undefined });
    close();
  });
  actions.appendChild(cancelBtn); actions.appendChild(saveBtn);
  box.appendChild(actions);

  overlay.appendChild(box);
  root.appendChild(overlay);
  ta.focus();

  function close() { root.innerHTML = ""; }
}

function emptyWeekData() {
  const schedule = {}, aprendizado = {}, resumo = {}, tarefas = {}, cards = {};
  DAY_DEFS.forEach(d => { schedule[d.key] = []; aprendizado[d.key] = ""; resumo[d.key] = ""; tarefas[d.key] = []; cards[d.key] = [{ id: "main" }]; });
  return { schedule, aprendizado, resumo, tarefas, cards };
}

function weekKey(m) { return `semana:${isoDate(m)}`; }

function loadWeek() {
  const base = emptyWeekData();
  const stored = loadJSON(weekKey(monday), null);
  if (stored) {
    weekData = {
      schedule: { ...base.schedule, ...stored.schedule },
      aprendizado: { ...base.aprendizado, ...stored.aprendizado },
      resumo: { ...base.resumo, ...stored.resumo },
      tarefas: { ...base.tarefas, ...stored.tarefas },
      cards: { ...base.cards, ...(stored.cards || {}) },
    };
  } else {
    weekData = base;
  }
}

let saveTimer = null;
function persistWeek() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const ok = saveJSON(weekKey(monday), weekData);
    if (window.pushWeekToCloud) window.pushWeekToCloud(isoDate(monday), weekData);
    const hint = document.getElementById("saveHint");
    hint.textContent = ok ? t("salvo") : t("erro_salvar");
    setTimeout(() => (hint.textContent = ""), 900);
  }, 400);
}

function discById(id) {
  return getDisciplinas().find(d => d.id === id);
}

function renderWeekRange() {
  const sunday = addDays(monday, 6);
  document.getElementById("weekRange").textContent = `${fmtShort(monday)} – ${fmtShort(sunday)}`;
}

function renderDiscBar() {
  const bar = document.getElementById("discBar");
  const list = getDisciplinas();
  bar.innerHTML = "";
  list.forEach(d => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.style.background = d.color + "22";
    chip.style.color = d.color;
    chip.style.border = `1px solid ${d.color}55`;
    chip.draggable = true;
    chip.textContent = d.name;
    chip.title = t("clique_para_escolher_dia");
    chip.addEventListener("dragstart", () => { dragDiscId = d.id; dragDiscColor = d.color; dragItem = null; });
    chip.addEventListener("click", (e) => {
      e.stopPropagation();
      const existing = chip.querySelector(".day-popover");
      document.querySelectorAll(".day-popover").forEach((p) => p.remove());
      if (existing) return; // clique de novo no mesmo chip só fecha
      const pop = document.createElement("div");
      pop.className = "day-popover";
      DAY_DEFS.forEach((day) => {
        const dayBtn = document.createElement("button");
        dayBtn.textContent = t("day_" + day.key);
        dayBtn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          weekData.schedule[day.key].push({ id: uid(), disciplinaId: d.id, hora: "", topico: "", nota: "" });
          persistWeek();
          activeDayKey = day.key;
          renderDayTrack();
          renderDayCard();
          pop.remove();
        });
        pop.appendChild(dayBtn);
      });
      chip.appendChild(pop);
    });
    bar.appendChild(chip);
  });
  if (list.length === 0) {
    const hint = document.createElement("span");
    hint.style.fontSize = "0.82rem";
    hint.style.opacity = "0.5";
    hint.innerHTML = `${t("disc_vazia_texto")} <a href="disciplinas.html" style="text-decoration:underline">${t("nav_disciplinas")}</a>.`;
    bar.appendChild(hint);
  }
}

// ---------- Trilha horizontal de dias (Segunda → Domingo, sempre nessa ordem) ----------
function renderDayTrack() {
  const track = document.getElementById("dayTrack");
  track.innerHTML = "";
  const tk = todayKey();
  const thisWeekIsCurrent = isoDate(monday) === isoDate(startOfWeekMonday(new Date()));

  DAY_DEFS.forEach((day, di) => {
    const dayDate = addDays(monday, di);
    const pill = document.createElement("button");
    pill.className = "day-pill";
    if (day.key === activeDayKey) pill.classList.add("active");
    if (thisWeekIsCurrent && day.key === tk) pill.classList.add("today");
    pill.style.setProperty("--pill-color", `var(${day.css})`);
    pill.innerHTML = `<span class="pill-name">${t("day_" + day.key)}</span><span class="pill-date">${fmtShort(dayDate)}</span>`;
    pill.addEventListener("click", () => { activeDayKey = day.key; renderDayTrack(); renderDayCard(); });
    track.appendChild(pill);
  });
}

// ---------- Card do dia ativo ----------
const EXTRA_CARD_COLORS = ["#8C6A3F", "#4F6B52", "#8C4A3E", "#5E4A6B", "#A8752E", "#3E6B6B"];

function renderDayCard() {
  const wrap = document.getElementById("dayCardWrap");
  wrap.innerHTML = "";
  const disciplinas = getDisciplinas();
  const day = DAY_DEFS.find(d => d.key === activeDayKey) || DAY_DEFS[0];
  const di = DAY_DEFS.findIndex(d => d.key === day.key);
  const dayDate = addDays(monday, di);

  if (!weekData.cards) weekData.cards = {};
  if (!weekData.cards[day.key] || weekData.cards[day.key].length === 0) weekData.cards[day.key] = [{ id: "main" }];
  const dayCards = weekData.cards[day.key];
  if (!activeSubCard[day.key] || !dayCards.find(c => c.id === activeSubCard[day.key])) activeSubCard[day.key] = dayCards[0].id;
  const activeCard = dayCards.find(c => c.id === activeSubCard[day.key]) || dayCards[0];
  const cardKey = activeCard.id === "main" ? day.key : `${day.key}::${activeCard.id}`;
  const cardColorCss = activeCard.id === "main" ? `var(${day.css})` : activeCard.color;

  // garante estruturas de dados pra esse card
  if (!weekData.schedule[cardKey]) weekData.schedule[cardKey] = [];
  if (weekData.aprendizado[cardKey] === undefined) weekData.aprendizado[cardKey] = "";
  if (weekData.resumo[cardKey] === undefined) weekData.resumo[cardKey] = "";
  if (!weekData.tarefas[cardKey]) weekData.tarefas[cardKey] = [];

  // abas de cards extras (observação 3)
  if (dayCards.length > 1) {
    const tabBar = document.createElement("div");
    tabBar.className = "day-card-tab-bar";
    dayCards.forEach((c, idx) => {
      const tab = document.createElement("button");
      tab.className = "day-card-tab" + (c.id === activeCard.id ? " active" : "");
      const bg = c.id === "main" ? `var(${day.css})` : c.color;
      if (c.id === activeCard.id) tab.style.background = bg;
      else { tab.style.borderColor = bg; tab.style.color = bg; }
      tab.textContent = idx === 0 ? t("day_" + day.key) : `${t("day_" + day.key)} ${idx + 1}`;
      tab.addEventListener("click", () => { activeSubCard[day.key] = c.id; renderDayCard(); });
      tabBar.appendChild(tab);
    });
    const addTab = document.createElement("button");
    addTab.className = "day-card-tab-add";
    addTab.textContent = "+";
    addTab.title = "Adicionar outro card neste dia";
    addTab.addEventListener("click", () => addExtraCard(day));
    tabBar.appendChild(addTab);
    wrap.appendChild(tabBar);
  }

  const card = document.createElement("div");
  card.className = "day-card" + (minimizedDays.has(cardKey) ? " minimized" : "");

  card.addEventListener("dragover", e => {
    e.preventDefault();
    card.classList.add("drag-over");
    if (dragDiscColor) card.style.setProperty("--drop-color", dragDiscColor + "55");
  });
  card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
  card.addEventListener("drop", () => {
    card.classList.remove("drag-over");
    if (dragDiscId) { weekData.schedule[cardKey].push({ id: uid(), disciplinaId: dragDiscId, hora: "", topico: "", nota: "" }); persistWeek(); renderDayCard(); }
    if (dragItem) {
      const { fromDay, itemId } = dragItem;
      if (fromDay !== cardKey) {
        const idx = weekData.schedule[fromDay].findIndex(i => i.id === itemId);
        if (idx > -1) {
          const [it] = weekData.schedule[fromDay].splice(idx, 1);
          weekData.schedule[cardKey].push(it);
          persistWeek(); renderDayCard();
        }
      }
    }
    dragDiscId = null; dragDiscColor = null; dragItem = null;
  });

  // head
  const head = document.createElement("div");
  head.className = "day-head";
  head.style.background = cardColorCss;
  head.innerHTML = `<div><div class="date">${fmtShort(dayDate)}</div><div class="name">${t("day_" + day.key)}</div></div>`;

  const headBtns = document.createElement("div");
  headBtns.className = "head-btns";

  const minBtn = document.createElement("button");
  minBtn.className = "min-btn";
  minBtn.textContent = minimizedDays.has(cardKey) ? "⌄" : "⌃";
  minBtn.title = minimizedDays.has(cardKey) ? "Expandir card" : "Minimizar card";
  minBtn.addEventListener("click", () => {
    if (minimizedDays.has(cardKey)) minimizedDays.delete(cardKey); else minimizedDays.add(cardKey);
    renderDayCard();
  });
  headBtns.appendChild(minBtn);

  if (dayCards.length <= 1) {
    const addTab = document.createElement("button");
    addTab.textContent = "≡+";
    addTab.title = "Adicionar outro card neste dia";
    addTab.style.fontSize = "0.7rem";
    addTab.addEventListener("click", () => addExtraCard(day));
    headBtns.appendChild(addTab);
  } else if (activeCard.id !== "main") {
    const delTab = document.createElement("button");
    delTab.textContent = "×";
    delTab.title = "Remover este card";
    delTab.addEventListener("click", () => removeExtraCard(day, activeCard.id));
    headBtns.appendChild(delTab);
  }

  const addBtn = document.createElement("button");
  addBtn.textContent = "+";
  addBtn.title = t("clique_para_escolher_dia");
  addBtn.addEventListener("click", () => { openAddDay = openAddDay === cardKey ? null : cardKey; renderDayCard(); });
  headBtns.appendChild(addBtn);

  head.appendChild(headBtns);
  card.appendChild(head);

  if (openAddDay === cardKey) {
    const addList = document.createElement("div");
    addList.className = "day-addlist";
    addList.style.background = cardColorCss + "22";
    if (disciplinas.length === 0) {
      addList.innerHTML = `<span style="font-size:.75rem;opacity:.5">${t("cadastre_primeiro")}</span>`;
    }
    disciplinas.forEach(d => {
      const b = document.createElement("button");
      b.textContent = d.name;
      b.style.color = d.color;
      b.style.borderColor = d.color + "55";
      b.addEventListener("click", () => {
        weekData.schedule[cardKey].push({ id: uid(), disciplinaId: d.id, hora: "", topico: "", nota: "" });
        openAddDay = null;
        persistWeek(); renderDayCard();
      });
      addList.appendChild(b);
    });
    card.appendChild(addList);
  }

  // schedule
  const sched = document.createElement("div");
  sched.className = "day-schedule";
  const items = weekData.schedule[cardKey];
  if (items.length === 0) {
    const e = document.createElement("div");
    e.className = "sched-empty";
    e.textContent = t("nenhuma_aula");
    sched.appendChild(e);
  }
  items.forEach(it => {
    const disc = discById(it.disciplinaId);
    if (!disc) return;
    const row = document.createElement("div");
    row.className = "sched-item";
    row.draggable = true;
    row.addEventListener("dragstart", () => { dragItem = { fromDay: cardKey, itemId: it.id }; dragDiscId = null; dragDiscColor = null; });
    row.addEventListener("dragover", e => {
      e.preventDefault();
      e.stopPropagation();
      row.classList.add("drag-over-item");
    });
    row.addEventListener("dragleave", () => row.classList.remove("drag-over-item"));
    row.addEventListener("drop", e => {
      e.preventDefault();
      e.stopPropagation();
      row.classList.remove("drag-over-item");

      if (dragItem) {
        const { fromDay: sourceKey, itemId: sourceId } = dragItem;
        if (sourceId === it.id) { dragItem = null; return; }
        const targetIndex = weekData.schedule[cardKey].findIndex(x => x.id === it.id);
        if (sourceKey === cardKey) {
          // troca de posição dentro do mesmo card
          const sourceIndex = weekData.schedule[cardKey].findIndex(x => x.id === sourceId);
          if (sourceIndex > -1 && targetIndex > -1) {
            const arr = weekData.schedule[cardKey];
            [arr[sourceIndex], arr[targetIndex]] = [arr[targetIndex], arr[sourceIndex]];
          }
        } else {
          // troca a disciplina de lugar com a de outro dia/card
          const sourceIndex = weekData.schedule[sourceKey].findIndex(x => x.id === sourceId);
          if (sourceIndex > -1 && targetIndex > -1) {
            const sourceItem = weekData.schedule[sourceKey][sourceIndex];
            const targetItem = weekData.schedule[cardKey][targetIndex];
            weekData.schedule[cardKey][targetIndex] = sourceItem;
            weekData.schedule[sourceKey][sourceIndex] = targetItem;
          }
        }
        dragItem = null;
        persistWeek(); renderDayCard();
        return;
      }

      if (dragDiscId) {
        const targetIndex = weekData.schedule[cardKey].findIndex(x => x.id === it.id);
        const novo = { id: uid(), disciplinaId: dragDiscId, hora: "", topico: "", nota: "" };
        if (targetIndex > -1) weekData.schedule[cardKey].splice(targetIndex, 0, novo);
        else weekData.schedule[cardKey].push(novo);
        dragDiscId = null; dragDiscColor = null;
        persistWeek(); renderDayCard();
      }
    });

    const openSubjectModal = () => {
      openNoteModal({
        title: disc.name,
        subtitle: t("day_" + day.key) + " · " + fmtShort(dayDate),
        showTopic: true,
        topicValue: it.topico || "",
        topicPlaceholder: "Título do tópico (ex: Mapa de Veitch-Karnaugh)",
        value: it.nota || "",
        onSave: ({ value, topic }) => {
          it.nota = value;
          it.topico = topic;
          persistWeek(); renderDayCard();
        },
      });
    };

    const dot = document.createElement("span");
    dot.className = "dot"; dot.style.background = disc.color;
    row.appendChild(dot);

    const nm = document.createElement("span");
    nm.className = "nm"; nm.style.color = disc.color; nm.textContent = disc.name;
    nm.addEventListener("click", openSubjectModal);
    row.appendChild(nm);

    const topicBadge = document.createElement("span");
    topicBadge.className = "topic-badge";
    topicBadge.textContent = it.topico ? it.topico : "+ tópico / anotação";
    topicBadge.addEventListener("click", openSubjectModal);
    row.appendChild(topicBadge);

    const horaInput = document.createElement("input");
    horaInput.placeholder = t("hora_placeholder");
    horaInput.value = it.hora;
    horaInput.addEventListener("input", e => { it.hora = e.target.value; persistWeek(); });
    row.appendChild(horaInput);

    const rm = document.createElement("button");
    rm.className = "rm"; rm.textContent = "×";
    rm.addEventListener("click", () => {
      weekData.schedule[cardKey] = weekData.schedule[cardKey].filter(x => x.id !== it.id);
      persistWeek(); renderDayCard();
    });
    row.appendChild(rm);
    sched.appendChild(row);
  });
  card.appendChild(sched);

  // body: aprendizado, resumo (só abrem ao clicar), tarefas
  const body = document.createElement("div");
  body.className = "day-body";

  body.appendChild(makeFieldToggle(t("aprendi_label"), weekData.aprendizado[cardKey], v => { weekData.aprendizado[cardKey] = v; persistWeek(); renderDayCard(); }));
  body.appendChild(makeFieldToggle(t("resumo_label"), weekData.resumo[cardKey], v => { weekData.resumo[cardKey] = v; persistWeek(); renderDayCard(); }));

  const taskWrap = document.createElement("div");
  const taskLabel = document.createElement("div");
  taskLabel.className = "field-label";
  taskLabel.textContent = t("tarefas_label");
  taskWrap.appendChild(taskLabel);

  weekData.tarefas[cardKey].forEach(task => {
    const row = document.createElement("label");
    row.className = "task-row";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = task.done;
    cb.addEventListener("change", () => { task.done = !task.done; persistWeek(); renderDayCard(); });
    row.appendChild(cb);
    const span = document.createElement("span");
    span.textContent = task.text;
    if (task.done) span.className = "done";
    row.appendChild(span);
    if (task.data || task.hora) {
      const when = document.createElement("span");
      when.className = "task-when";
      when.textContent = [task.data ? fmtShort(new Date(task.data + "T00:00:00")) : "", task.hora || ""].filter(Boolean).join(" · ");
      row.appendChild(when);
    }
    const rm = document.createElement("button");
    rm.className = "rm"; rm.textContent = "×";
    rm.addEventListener("click", (e) => {
      e.preventDefault();
      weekData.tarefas[cardKey] = weekData.tarefas[cardKey].filter(x => x.id !== task.id);
      persistWeek(); renderDayCard();
    });
    row.appendChild(rm);
    taskWrap.appendChild(row);
  });

  if (openTaskForm === cardKey) {
    const form = document.createElement("div");
    form.className = "task-add-form";
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.placeholder = t("tarefa_placeholder");
    nameInput.value = t("monitoria_nome_padrao");
    const dateInput = document.createElement("input");
    dateInput.type = "date";
    dateInput.title = t("task_data_label");
    const timeInput = document.createElement("input");
    timeInput.type = "time";
    timeInput.title = t("task_hora_label");
    const confirmBtn = document.createElement("button");
    confirmBtn.textContent = t("btn_confirmar");
    const confirmAdd = () => {
      if (!nameInput.value.trim()) return;
      weekData.tarefas[cardKey].push({ id: uid(), text: nameInput.value.trim(), done: false, data: dateInput.value || "", hora: timeInput.value || "" });
      openTaskForm = null;
      persistWeek(); renderDayCard();
    };
    confirmBtn.addEventListener("click", confirmAdd);
    nameInput.addEventListener("keydown", e => { if (e.key === "Enter") confirmAdd(); });
    form.appendChild(nameInput); form.appendChild(dateInput); form.appendChild(timeInput); form.appendChild(confirmBtn);
    taskWrap.appendChild(form);
  } else {
    const addBtnTask = document.createElement("button");
    addBtnTask.className = "task-add-btn";
    addBtnTask.textContent = t("btn_add_monitoria");
    addBtnTask.addEventListener("click", () => { openTaskForm = cardKey; renderDayCard(); });
    taskWrap.appendChild(addBtnTask);
  }
  body.appendChild(taskWrap);

  card.appendChild(body);
  wrap.appendChild(card);
}

function addExtraCard(day) {
  if (!weekData.cards) weekData.cards = {};
  if (!weekData.cards[day.key]) weekData.cards[day.key] = [{ id: "main" }];
  const cards = weekData.cards[day.key];
  const newId = uid();
  const colorIdx = cards.filter(c => c.id !== "main").length % EXTRA_CARD_COLORS.length;
  cards.push({ id: newId, color: EXTRA_CARD_COLORS[colorIdx] });
  const key = `${day.key}::${newId}`;
  weekData.schedule[key] = [];
  weekData.aprendizado[key] = "";
  weekData.resumo[key] = "";
  weekData.tarefas[key] = [];
  activeSubCard[day.key] = newId;
  persistWeek(); renderDayCard();
}

function removeExtraCard(day, cardId) {
  if (cardId === "main") return;
  weekData.cards[day.key] = weekData.cards[day.key].filter(c => c.id !== cardId);
  const key = `${day.key}::${cardId}`;
  delete weekData.schedule[key];
  delete weekData.aprendizado[key];
  delete weekData.resumo[key];
  delete weekData.tarefas[key];
  activeSubCard[day.key] = "main";
  persistWeek(); renderDayCard();
}

// botão "+ Adicionar resumo/anotação" — o campo só aparece dentro do modal ao clicar
function makeFieldToggle(label, value, onChange) {
  const btn = document.createElement("button");
  btn.className = "field-toggle" + (value ? " filled" : "");
  const preview = value ? value.slice(0, 60) + (value.length > 60 ? "…" : "") : t("anote_placeholder");
  btn.innerHTML = `
    <span class="ft-plus">${value ? "✎" : "+"}</span>
    <span class="ft-text">
      <div class="ft-label">${label}</div>
      <div class="ft-preview">${preview}</div>
    </span>`;
  btn.addEventListener("click", () => {
    openNoteModal({
      title: label,
      showTopic: false,
      value: value,
      onSave: ({ value: v }) => onChange(v),
    });
  });
  return btn;
}

function refreshAll() {
  renderWeekRange();
  renderDiscBar();
  loadWeek();
  renderDayTrack();
  renderDayCard();
  if (window.pullWeekFromCloud) window.pullWeekFromCloud(isoDate(monday));
}

document.getElementById("prevWeek").addEventListener("click", () => { monday = addDays(monday, -7); refreshAll(); });
document.getElementById("nextWeek").addEventListener("click", () => { monday = addDays(monday, 7); refreshAll(); });
document.getElementById("todayBtn").addEventListener("click", () => { monday = startOfWeekMonday(new Date()); activeDayKey = todayKey(); document.getElementById("pickDate").value = isoDate(new Date()); refreshAll(); });

// Calendário manual: escolher qualquer data pula para a semana correspondente
document.getElementById("pickDate").value = isoDate(new Date());
document.getElementById("pickDate").addEventListener("change", (e) => {
  if (!e.target.value) return;
  const [y, m, d] = e.target.value.split("-").map(Number);
  monday = startOfWeekMonday(new Date(y, m - 1, d));
  refreshAll();
});

document.addEventListener("click", () => {
  document.querySelectorAll(".day-popover").forEach((p) => p.remove());
});

refreshAll();
</script>

let cloudUid = null;

async function pullDisciplinasFromCloud(uid) {
  try {
    const ref = doc(db, "usuarios", uid, "dados", "disciplinas");
    const snap = await getDoc(ref);
    if (snap.exists() && Array.isArray(snap.data().lista)) {
      saveJSON("disciplinas", snap.data().lista);
    } else {
      const local = getDisciplinas();
      if (local.length) await setDoc(ref, { lista: local, atualizadoEm: Date.now() });
    }
  } catch (e) {
    console.error("tape: erro ao sincronizar disciplinas", e);
  }
}

window.pullWeekFromCloud = async function (mondayIso) {
  if (!cloudUid) return;
  try {
    const ref = doc(db, "usuarios", cloudUid, "semanas", mondayIso);
    const snap = await getDoc(ref);
    if (snap.exists() && snap.data().dados) {
      saveJSON(`semana:${mondayIso}`, snap.data().dados);
      if (isoDate(monday) === mondayIso) { loadWeek(); renderDayCard(); }
    } else {
      const local = loadJSON(`semana:${mondayIso}`, null);
      if (local) await setDoc(ref, { dados: local, atualizadoEm: Date.now() });
    }
  } catch (e) {
    console.error("tape: erro ao sincronizar semana", e);
  }
};

window.pushWeekToCloud = async function (mondayIso, dados) {
  if (!cloudUid) return;
  try {
    await setDoc(doc(db, "usuarios", cloudUid, "semanas", mondayIso), { dados, atualizadoEm: Date.now() });
  } catch (e) {
    console.error("tape: erro ao salvar semana na nuvem", e);
  }
};

onAuthStateChanged(auth, async (user) => {
  cloudUid = user ? user.uid : null;
  if (cloudUid) {
    await pullDisciplinasFromCloud(cloudUid);
    await window.pullWeekFromCloud(isoDate(monday));
    refreshAll();
  }
});
</script>
